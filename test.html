<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Fat Percentage Gradient</title>
<style>
body {
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: "Poppins", sans-serif;
}

/* === Outer container === */
.container {
  width: 560px;
  padding: 40px 20px;
  background: #DEEDE7;
  border: 3px solid #deede7;
  border-radius: 20px;
  box-shadow: 0 0 10px rgba(222, 237, 231, 0.5);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* === Inner content === */
.wrapper {
  position: relative;
  width: 500px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

/* Gradient bar */
.gradient-bar {
  position: relative;
  width: 480px;
  height: 20px;
  border-radius: 10px;
  background: linear-gradient(90deg, #4caf4f 0%, #e6ed14 50%, #f43e44 100%);
  box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.1);
}

/* min and max labels */
.scale-labels {
  display: flex;
  justify-content: space-between;
  width: 480px;
  font-size: 16px;
  color: #294e3e;
  font-weight: 600;
}

/* Movable rectangle indicator */
.indicator {
  position: absolute;
  top: -45px;
  width: 90px;
  height: 35px;
  background: #294e3e;
  border-radius: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-weight: 700;
  font-size: 18px;
  transition: left 0.3s ease;
}

/* Triangle pointer */
.indicator::after {
  content: "";
  position: absolute;
  bottom: -9px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 10px solid #294e3e;
}

/* Range slider (transparent, just for control) */
input[type="range"] {
  width: 480px;
  -webkit-appearance: none;
  appearance: none;
  height: 8px;
  border-radius: 5px;
  background: transparent;
  position: absolute;
  top: 0;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  background: transparent;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="container">
  <div class="wrapper">
    <div class="gradient-bar">
      <div class="indicator" id="indicator">20%</div>
      <input type="range" id="slider" min="5" max="50" value="20" step="1">
    </div>
    <div class="scale-labels">
      <span>5%</span>
      <span>50%</span>
    </div>
  </div>
</div>

<script>
const slider = document.getElementById("slider");
const indicator = document.getElementById("indicator");
const barWidth = 480;
const indicatorWidth = 90;

function updateIndicator(value) {
  const percent = (value - 5) / (50 - 5);
  const position = percent * (barWidth - indicatorWidth);
  indicator.style.left = `${position}px`;
  indicator.textContent = `${value}%`;
}

slider.addEventListener("input", e => updateIndicator(e.target.value));

// Initialize
updateIndicator(slider.value);
</script>

</body>
</html>
