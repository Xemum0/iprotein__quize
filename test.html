<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>زر الأداء</title>
<style>
  body{
    background:#ecf5f1;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Poppins","Tajawal",sans-serif;
  }

  /* Button shell */
  .select-btn{
    width:577px; height:80px;
    border:2px solid #294E3E; border-radius:8px;
    background:#fff; color:#294E3E;
    display:flex; align-items:center;
    padding:0 30px;
    cursor:pointer;
    font-size:20px; font-weight:600;
    transition:background .25s ease, color .25s ease, border-color .25s ease;
        flex-direction: row-reverse;
  }

  /* Active (clicked) state */
  .select-btn.active{
    background:#BCDCCE;
    color:#294E3E;
  }

  /* Right pack: icon at the VERY right, then text to its left */
  .right-pack{
    display:flex; align-items:center;
    gap:12px;
    /* row-reverse puts the icon at the extreme right, then the label */
    flex-direction:row-reverse;
  }

  .label{
    line-height:1;
    /* make sure Arabic flows RTL without affecting overall layout */
    direction:rtl;
  }

  .icon{
    width:40px; height:40px;
    background:#fff;             /* default circle bg */
    border-radius:50%;
    padding:8px;                 /* inner padding for the svg */
    transition:background .25s ease;
  }

  /* When active, icon circle goes lighter mint */
  .select-btn.active .icon{
    background:#DEEDE7;
  }

  /* Flexible spacer to push checkbox to the far left */
  .spacer{ flex:1; }

  /* Left-end small checkbox */
  .checkbox{
    width:22px; height:22px;
    border:2px solid #294E3E; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    transition:background .25s ease, border-color .25s ease;
  }
  .tick{
    width:10px; height:6px;
    border-left:2px solid #294E3E;
    border-bottom:2px solid #294E3E;
    transform:rotate(-45deg);
    opacity:0; transition:opacity .25s ease, border-color .25s ease;
  }
  .select-btn.active .checkbox{
    background:#294E3E; border-color:#294E3E;
  }
  .select-btn.active .tick{
    opacity:1; border-color:#fff; /* white tick */
  }

  /* Remove default button styling on focus for consistency */
  .select-btn:focus{ outline:none; }
</style>
</head>
<body>

<button class="select-btn" id="performanceBtn" type="button">
  <!-- RIGHT SIDE: icon then text (visually) -->
  <div class="right-pack">
    <img src="spike.svg" alt="أيقونة الأداء" class="icon">
    <span class="label">الأداء</span>
  </div>

  <!-- BIG FLEX SPACE -->
  <div class="spacer"></div>

  <!-- FAR LEFT: checkbox -->
  <div class="checkbox" aria-hidden="true">
    <div class="tick"></div>
  </div>
</button>

<script>
  const btn = document.getElementById('performanceBtn');
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
  });
</script>

</body>
</html>
