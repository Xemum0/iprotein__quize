<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>Meal Selection UI</title>
    <!-- Importing the font referenced in the variables -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      /* * MOCK VARIABLES 
       * These variables were referenced in the original CSS but not provided. 
       * I have defined them here to make the design functional.
       */
      :root {
        --grey-1: #ffffff;
        --grey-2: #f7f7f7;
        --primitives-colors-primary-primary-950: #1a1e23;
        --primitives-colors-primary-primary-50: #eff6ff;
        --primitives-colors-white-white-50-w: #ffffff;
        --primitives-colors-primary-primary-500-p: #3b82f6; /* Example Blue */
        
        /* Typography Mocks based on variable names */
        --typography-family-IBM-plex-sans-arabic-semibold-36-font-family: 'IBM Plex Sans Arabic', sans-serif;
        --typography-family-IBM-plex-sans-arabic-semibold-36-font-weight: 600;
        --typography-family-IBM-plex-sans-arabic-semibold-36-font-size: 36px;
        --typography-family-IBM-plex-sans-arabic-semibold-36-letter-spacing: 0px;
        --typography-family-IBM-plex-sans-arabic-semibold-36-line-height: 1.2;
        --typography-family-IBM-plex-sans-arabic-semibold-36-font-style: normal;

        --typography-family-IBM-plex-sans-arabic-medium-18-font-family: 'IBM Plex Sans Arabic', sans-serif;
        --typography-family-IBM-plex-sans-arabic-medium-18-font-weight: 500;
        --typography-family-IBM-plex-sans-arabic-medium-18-font-size: 18px;
        --typography-family-IBM-plex-sans-arabic-medium-18-letter-spacing: 0px;
        --typography-family-IBM-plex-sans-arabic-medium-18-line-height: 1.5;
        --typography-family-IBM-plex-sans-arabic-medium-18-font-style: normal;
      }

      body {
        margin: 0;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        font-family: 'IBM Plex Sans Arabic', sans-serif;
      }

      /* --- ORIGINAL CSS EXTRACTED --- */

      .frame {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        position: relative;
        width: 100%; /* Added for responsiveness */
      }

      .frame .div-wrapper {
        width: 577px;
        gap: 8px;
        flex: 0 0 auto;
        display: flex;
        align-items: flex-start;
        position: relative;
        max-width: 100%; /* Added for responsiveness */
        justify-content: center; /* Center text on mobile */
      }

      .frame .text-wrapper {
        position: relative;
        width: 577px;
        margin-top: -1.00px;
        font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-36-font-family);
        font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-36-font-weight);
        color: var(--primitives-colors-primary-primary-950);
        font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-36-font-size);
        text-align: center;
        letter-spacing: var(--typography-family-IBM-plex-sans-arabic-semibold-36-letter-spacing);
        line-height: var(--typography-family-IBM-plex-sans-arabic-semibold-36-line-height);
        direction: rtl;
        font-style: var(--typography-family-IBM-plex-sans-arabic-semibold-36-font-style);
        max-width: 100%; /* Added for responsiveness */
      }

      .frame .div {
        width: 1240px;
        height: 300px;
        justify-content: center;
        gap: 24px;
        display: flex;
        align-items: flex-start;
        position: relative;
        
        /* Responsive adjustments replacing fixed dimensions */
        max-width: 100%;
        height: auto;
        flex-wrap: wrap;
      }

      .frame .option-card {
        display: flex;
        width: 292px;
        height: 300px;
        align-items: flex-end;
        justify-content: flex-end;
        gap: 16px;
        padding: 16px 24px;
        position: relative;
        background-color: var(--primitives-colors-primary-primary-50);
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.2s ease;
        /* Responsive adjustments */
        max-width: 100%; 
        flex-shrink: 0;
      }

      .frame .option-card:hover {
        transform: translateY(-5px);
      }

      .frame .image {
        position: absolute;
        top: 16px;
        left: 0; /* Adjusted for RTL? Original said left:0 */
        width: 292px;
        height: 244px;
        aspect-ratio: 1.2;
        object-fit: cover; /* Ensure image fits well */
        /* Centering fix for the image within the card visually */
        left: 50%;
        transform: translateX(-50%);
      }

      .frame .div-2 {
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        flex: 1;
        flex-grow: 1;
        display: flex;
        align-items: flex-start;
        position: relative;
        z-index: 1; /* Ensure text is above image */
      }

      .frame .text-wrapper-2 {
        display: flex;
        flex-direction: column;
        height: 52px;
        align-items: center;
        justify-content: center;
        padding: 8px 24px;
        position: relative;
        align-self: stretch;
        width: 100%;
        background-color: var(--primitives-colors-white-white-50-w);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid;
        border-color: var(--primitives-colors-primary-primary-500-p);
        box-sizing: border-box; /* Fix box model */
      }

      .frame .text {
        position: relative;
        width: fit-content;
        font-family: var(--typography-family-IBM-plex-sans-arabic-medium-18-font-family);
        font-weight: var(--typography-family-IBM-plex-sans-arabic-medium-18-font-weight);
        color: var(--primitives-colors-primary-primary-500-p);
        font-size: var(--typography-family-IBM-plex-sans-arabic-medium-18-font-size);
        letter-spacing: var(--typography-family-IBM-plex-sans-arabic-medium-18-letter-spacing);
        line-height: var(--typography-family-IBM-plex-sans-arabic-medium-18-line-height);
        direction: rtl;
        font-style: var(--typography-family-IBM-plex-sans-arabic-medium-18-font-style);
      }

      .frame .button {
        all: unset;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        width: 300px;
        height: 52px;
        align-items: center;
        justify-content: center;
        padding: 8px 24px;
        position: relative;
        background-color: var(--primitives-colors-primary-primary-500-p);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        max-width: 100%;
      }

      .frame .btn-primary-btn-lg {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 8px 0px;
        position: relative;
        flex: 0 0 auto;
        margin-top: -3.50px;
        margin-bottom: -3.50px;
      }

      .frame .masked-icon {
        display: flex;
        width: 24px;
        height: 24px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 2px 0px;
        position: relative;
        aspect-ratio: 1;
      }

      .frame .remix-icons-line {
        position: relative;
        width: 24px;
        height: 24px;
        margin-top: -2.00px;
        margin-bottom: -2.00px;
        aspect-ratio: 1;
      }

      .frame .button-2 {
        position: relative;
        width: fit-content;
        margin-top: -1.00px;
        font-family: var(--typography-family-IBM-plex-sans-arabic-medium-18-font-family);
        font-weight: var(--typography-family-IBM-plex-sans-arabic-medium-18-font-weight);
        color: var(--primitives-colors-white-white-50-w);
        font-size: var(--typography-family-IBM-plex-sans-arabic-medium-18-font-size);
        letter-spacing: var(--typography-family-IBM-plex-sans-arabic-medium-18-letter-spacing);
        line-height: var(--typography-family-IBM-plex-sans-arabic-medium-18-line-height);
        direction: rtl;
        font-style: var(--typography-family-IBM-plex-sans-arabic-medium-18-font-style);
      }

      /* Icons color fix */
      .remix-icons-line {
        filter: brightness(0) invert(1); /* Make arrow white */
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="div-wrapper">
        <p class="text-wrapper">كم وجبة رئيسية تتناولين يوميا؟</p>
      </div>
      <div class="div">
        
        <!-- Card 1: Dinner -->
        <div class="div-wrapper-mobile"></div>
        <div class="option-card">
          <!-- Placeholder image used because original src was local -->
          <img class="image" src="https://images.unsplash.com/photo-1559847844-5315695dadae?auto=format&fit=crop&q=80&w=400" alt="Dinner" />
          <div class="div-2">
            <div class="text-wrapper-2">
              <div class="text">العشاء</div>
            </div>
          </div>
        </div>

        <!-- Card 2: Lunch -->
        <div class="option-card">
           <!-- Placeholder image used because original src was local -->
          <img class="image" src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&q=80&w=400" alt="Lunch" />
          <div class="div-2">
            <div class="text-wrapper-2">
              <div class="text">الغداء</div>
            </div>
          </div>
        </div>

        <!-- Card 3: Breakfast -->
        <div class="option-card">
           <!-- Placeholder image used because original src was local -->
          <img class="image" src="https://images.unsplash.com/photo-1533089862017-541e53bb877d?auto=format&fit=crop&q=80&w=400" alt="Breakfast" />
          <div class="div-2">
            <div class="text-wrapper-2">
              <div class="text">الفطور</div>
            </div>
          </div>
        </div>

      </div>
      <button class="button">
        <div class="btn-primary-btn-lg">
          <div class="masked-icon">
            <!-- Inline SVG for the arrow since local file is missing -->
            <svg class="remix-icons-line" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7.82843 11L13.1924 5.63604L11.7782 4.22183L4 12L11.7782 19.7782L13.1924 18.364L7.82843 13H20V11H7.82843Z"></path>
            </svg>
          </div>
          <div class="button-2">التالي</div>
        </div>
      </button>
    </div>
  </body>
</html>
