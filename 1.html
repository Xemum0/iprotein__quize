<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>برنامج تمارين كارديو وجسم كامل</title>

  <style>
    .frame {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
      gap: 16px;
      padding: 40px;
      position: relative;
      background-color: var(--primitives-colors-primary-primary-300);
      border-radius: 24px;
      overflow: hidden;
    }

    .frame .div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      align-self: stretch;
      width: 100%;
      flex: 0 0 auto;
    }

    .frame .chip {
      display: inline-flex;
      min-width: 32px;
      height: 52px;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 16px;
      background-color: var(--primitives-colors-primary-primary-500-p);
      border-radius: 8px;
    }

    .frame .text-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-family);
      font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-weight);
      color: var(--primitives-colors-white-white-50-w);
      font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-size);
      letter-spacing: var(--typography-family-IBM-plex-sans-arabic-semibold-16-letter-spacing);
      line-height: var(--typography-family-IBM-plex-sans-arabic-semibold-16-line-height);
      direction: rtl;
    }

    .frame .div-2 {
      display: inline-flex;
      align-items: center;
      gap: 16px;
    }

    .frame .button {
      width: fit-content;
      margin-top: -0.5px;
      font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-26-font-family);
      font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-26-font-weight);
      color: var(--primitives-colors-primary-primary-500-p);
      font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-26-font-size);
      direction: rtl;
      letter-spacing: var(--typography-family-IBM-plex-sans-arabic-semibold-26-letter-spacing);
      line-height: var(--typography-family-IBM-plex-sans-arabic-semibold-26-line-height);
    }

    .frame .masked-icon {
      display: flex;
      width: 40px;
      height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 2px 0px;
      background-color: var(--primitives-colors-white-white-50-w);
      border-radius: 50px;
      aspect-ratio: 1;
    }

    .frame .text-wrapper-2 {
      width: fit-content;
      margin-top: -1px;
      font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-24-font-family);
      font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-24-font-weight);
      color: var(--primitives-colors-primary-primary-950);
      font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-24-font-size);
      text-align: right;
      letter-spacing: var(--typography-family-IBM-plex-sans-arabic-semibold-24-letter-spacing);
      line-height: var(--typography-family-IBM-plex-sans-arabic-semibold-24-line-height);
    }

    .frame .div-3 {
      display: flex;
      max-width: 1080px;
      width: 100%;
      min-height: 110px;
      align-items: flex-end;
      justify-content: space-between;
      padding: 24px 40px;
      background-color: var(--primitives-colors-secondary-secondary-300);
      border-radius: 24px;
    }

    .frame .div-4 {
      display: flex;
      max-width: 209px;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .frame .button-2,
    .frame .button-5 {
      max-width: 177px;
      margin-top: -1px;
      font-family: var(--typography-family-IBM-plex-sans-arabic-medium-20-font-family);
      font-weight: var(--typography-family-IBM-plex-sans-arabic-medium-20-font-weight);
      color: var(--primitives-colors-primary-primary-950);
      font-size: var(--typography-family-IBM-plex-sans-arabic-medium-20-font-size);
      direction: rtl;
      letter-spacing: var(--typography-family-IBM-plex-sans-arabic-medium-20-letter-spacing);
      line-height: var(--typography-family-IBM-plex-sans-arabic-medium-20-line-height);
    }

    .frame .remix-icons-line {
      width: 24px;
      height: 24px;
    }

    .frame .div-5 {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .frame .button-3 {
      width: fit-content;
      margin-top: -1px;
      font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-20-font-family);
      font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-20-font-weight);
      color: var(--primitives-colors-primary-primary-950);
      font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-20-font-size);
      direction: rtl;
      letter-spacing: var(--typography-family-IBM-plex-sans-arabic-semibold-20-letter-spacing);
      line-height: var(--typography-family-IBM-plex-sans-arabic-semibold-20-line-height);
    }

    .frame .button-4 {
      font-family: var(--typography-family-IBM-plex-sans-arabic-medium-16-font-family);
      font-weight: var(--typography-family-IBM-plex-sans-arabic-medium-16-font-weight);
      color: var(--primitives-colors-primary-primary-950);
      font-size: var(--typography-family-IBM-plex-sans-arabic-medium-16-font-size);
      direction: rtl;
      letter-spacing: var(--typography-family-IBM-plex-sans-arabic-medium-16-letter-spacing);
      line-height: var(--typography-family-IBM-plex-sans-arabic-medium-16-line-height);
    }

    h1.button,
    h2.button-3,
    p.button-4 {
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
    }
  </style>
</head>

<body>

  <main class="frame">

    <header class="div">
      <span class="chip" role="status" aria-label="نوع التمرين">
        <span class="text-wrapper">كارديو وجسم كامل</span>
      </span>

      <div class="div-2">
        <h1 class="button">الأحد</h1>
        <div class="masked-icon" role="img" aria-label="اليوم الأول">
          <span class="text-wrapper-2">1</span>
        </div>
      </div>
    </header>

    <article class="div-3">
      <div class="div-4">
        <span class="button-2">1 × 30 دقيقة</span>
        <img class="remix-icons-line" src="img/timer-line.svg" alt="مؤقت">
      </div>
      <div class="div-5">
        <h2 class="button-3">مشي سريع/جري خفيف</h2>
        <p class="button-4">معدل متوسط</p>
      </div>
    </article>

    <article class="div-3">
      <div class="div-4">
        <span class="button-5">3 × 10</span>
        <img class="remix-icons-line" src="img/timer-line.svg" alt="مؤقت">
      </div>
      <div class="div-5">
        <h2 class="button-3">تمرين بيربي</h2>
        <p class="button-4">حركة كاملة</p>
      </div>
    </article>

    <article class="div-3">
      <div class="div-4">
        <span class="button-2">3 × 60 ثانية</span>
        <img class="remix-icons-line" src="img/timer-line.svg" alt="مؤقت">
      </div>
      <div class="div-5">
        <h2 class="button-3">قفز بالحبل</h2>
        <p class="button-4">سرعة معتدلة</p>
      </div>
    </article>

    <article class="div-3">
      <div class="div-4">
        <span class="button-2">3 × 45 ثانية</span>
        <img class="remix-icons-line" src="img/timer-line.svg" alt="مؤقت">
      </div>
      <div class="div-5">
        <h2 class="button-3">بلانك</h2>
        <p class="button-4">شد البطن</p>
      </div>
    </article>

  </main>

</body>
</html>
