<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <style>
        .frame {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 40px;
  position: relative;
}

.frame .text-wrapper {
  position: relative;
  align-self: stretch;
  margin-top: -1px;
  font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-48-font-family);
  font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-48-font-weight);
  color: var(--primitives-colors-primary-primary-950);
  font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-48-font-size);
  text-align: center;
  letter-spacing: var(--typography-family-IBM-plex-sans-arabic-semibold-48-letter-spacing);
  line-height: var(--typography-family-IBM-plex-sans-arabic-semibold-48-line-height);
  direction: rtl;
  font-style: var(--typography-family-IBM-plex-sans-arabic-semibold-48-font-style);
}

.frame .div {
  display: inline-flex;
  align-items: center;
  gap: 32px;
  position: relative;
  flex: 0 0 auto;
}

.frame .image {
  position: relative;
  width: 161px;
  height: 440px;
}

.frame .div-2 {
  display: inline-flex;
  align-items: flex-start;
  justify-content: flex-end;
  gap: 16px;
  position: relative;
  flex: 0 0 auto;
}

.frame .div-3 {
  display: flex;
  flex-direction: column;
  width: 200px;
  align-items: flex-end;
  gap: 16px;
  position: relative;
}

.frame .indicator {
  display: flex;
  flex-direction: column;
  height: 130px;
  align-items: flex-end;
  justify-content: space-between;
  padding: 16px 24px;
  position: relative;
  align-self: stretch;
  width: 100%;
  background-color: var(--primitives-colors-secondary-secondary-100);
  border-radius: 16px;
}

.frame .two-oclock {
  width: 24px;
  height: 24px;
  aspect-ratio: 1;
  background-image: url(./img/two-oclock.png);
  background-size: cover;
  background-position: 50% 50%;
}

.frame .duration-info {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  position: relative;
  flex: 0 0 auto;
}

.frame .description-text {
  align-self: stretch;
  margin-top: -1px;
  font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-family);
  font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-weight);
  color: var(--primitives-colors-secondary-secondary-600);
  font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-size);
  direction: rtl;
}

.frame .description-text-2 {
  width: fit-content;
  font-family: var(--typography-family-IBM-plex-sans-arabic-medium-22-font-family);
  font-weight: var(--typography-family-IBM-plex-sans-arabic-medium-22-font-weight);
  color: var(--primitives-colors-secondary-secondary-800);
  font-size: var(--typography-family-IBM-plex-sans-arabic-medium-22-font-size);
  direction: rtl;
}

.frame .indicator-2 {
  height: 180px;
  background-color: var(--primitives-colors-warning-warning-100);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  padding: 16px 24px;
  position: relative;
  align-self: stretch;
  width: 100%;
  border-radius: 16px;
}

.frame .tear-off-calendar {
  width: 24px;
  height: 24px;
  aspect-ratio: 1;
  background-image: url(./img/tear-off-calendar.png);
  background-size: cover;
  background-position: 50% 50%;
}

.frame .div-4 {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
  align-self: stretch;
  width: 100%;
}

.frame .description-text-3 {
  align-self: stretch;
  margin-top: -1px;
  font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-family);
  font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-weight);
  color: var(--primitives-colors-warning-warning-600);
  font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-size);
  direction: rtl;
}

.frame .description-text-4 {
  width: fit-content;
  font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-22-font-family);
  font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-22-font-weight);
  color: var(--primitives-colors-warning-warning-700);
  font-size: var(--typography-family-IBM-plex-sans-arabic-semibold-22-font-size);
  text-align: right;
}

.frame .div-5 {
  display: flex;
  flex-direction: column;
  width: 204px;
  align-items: flex-start;
  gap: 16px;
  position: relative;
}

.frame .indicator-3 {
  height: 180px;
  background-color: var(--primitives-colors-error-error-100);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  padding: 16px 24px;
  border-radius: 16px;
}

.frame .direct-hit {
  width: 24px;
  height: 24px;
  aspect-ratio: 1;
  background-image: url(./img/direct-hit.png);
  background-size: cover;
}

.frame .description-text-5 {
  align-self: stretch;
  margin-top: -1px;
  font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-family);
  font-weight: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-weight);
  color: var(--primitives-colors-error-error-600);
  direction: rtl;
}

.frame .description-text-6 {
  width: fit-content;
  font-family: var(--typography-family-IBM-plex-sans-arabic-medium-22-font-family);
  font-weight: var(--typography-family-IBM-plex-sans-arabic-medium-22-font-weight);
  color: var(--primitives-colors-error-error-600);
  direction: rtl;
}

.frame .indicator-4 {
  height: 130px;
  background-color: var(--primitives-colors-primary-primary-100);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  padding: 16px 24px;
  border-radius: 16px;
}

.frame .fire {
  width: 24px;
  height: 24px;
  aspect-ratio: 1;
  background-image: url(./img/fire.png);
  background-size: cover;
}

.frame .description-text-7 {
  align-self: stretch;
  margin-top: -1px;
  font-family: var(--typography-family-IBM-plex-sans-arabic-semibold-16-font-family);
  color: var(--primitives-colors-primary-primary-500-p);
  direction: rtl;
}

.frame .description-text-8 {
  width: fit-content;
  font-family: var(--typography-family-IBM-plex-sans-arabic-medium-22-font-family);
  color: var(--primitives-colors-primary-primary-500-p);
  text-align: right;
}

    </style>
  </head>

  <body>
    <div class="frame">
      <div class="text-wrapper">خطتك الشخصية جاهزة!</div>

      <div class="div">
        <img class="image" src="img/image-66.png" />

        <div class="div-2">
          <div class="div-3">

            <div class="indicator">
              <div class="two-oclock"></div>
              <div class="duration-info">
                <div class="description-text">المدة</div>
                <div class="description-text-2">06 أشهر</div>
              </div>
            </div>

            <div class="indicator-2">
              <div class="tear-off-calendar"></div>
              <div class="div-4">
                <div class="description-text-3">أيام التمرين</div>
                <div class="description-text-4">03</div>
              </div>
            </div>

          </div>

          <div class="div-5">

            <div class="indicator-3">
              <div class="direct-hit"></div>
              <div class="div-4">
                <div class="description-text-5">الهدف</div>
                <div class="description-text-6">إنقاص الوزن</div>
              </div>
            </div>

            <div class="indicator-4">
              <div class="fire"></div>
              <div class="div-4">
                <div class="description-text-7">السعرات الحرارية</div>
                <div class="description-text-8">1580</div>
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>
  </body>
</html>
