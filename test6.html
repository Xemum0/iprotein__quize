<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>RTL Action Buttons</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        /* Custom Tailwind Configuration for primary color, using Indigo-500 */
        :root {
            --color-primary: 34, 197, 94; /* Green */
        }
        .whatsapp-icon {
            color: #25d366; /* Specific WhatsApp green */
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: 'rgb(79, 70, 229)', // Indigo-600 for primary actions
                        },
                    },
                    spacing: {
                        '13': '3.25rem', // 52px height
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Button Frame/Container -->
    <div class="frame max-w-6xl w-full flex flex-col md:flex-row gap-6 mx-auto">

        <!-- Button 1: Outline (Create New Plan) with Refresh Icon -->
        <!-- The content is visually reversed (Icon - Text) for RTL, achieved using flex-row-reverse -->
        <button class="button w-full md:flex-1 h-13 py-2 px-6 rounded-lg overflow-hidden
                       flex items-center justify-center border border-primary-500
                       text-primary-500 font-medium text-lg hover:bg-primary-500/10 transition duration-150 ease-in-out">
            <div class="btn-primary-btn-lg flex items-center gap-2">
                <!-- Text (right side of the group) -->
                <div class="text-wrapper text-right">إنشاء خطة جديدة</div>
                <!-- Icon (left side of the group) -->
                <div class="masked-icon w-6 h-6 flex items-center justify-center">
                    <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
                </div>
            </div>
        </button>

        <!-- Button 2: Outline (Send on WhatsApp) with WhatsApp Icon -->
        <button class="button w-full md:flex-1 h-13 py-2 px-6 rounded-lg overflow-hidden
                       flex items-center justify-center border border-primary-500
                       text-primary-500 font-medium text-lg hover:bg-primary-500/10 transition duration-150 ease-in-out">
            <div class="btn-primary-btn-lg flex items-center gap-2">
                <!-- Text -->
                <div class="text-wrapper text-right">إرسال على الواتساب</div>
                <!-- Icon (Using a placeholder icon and coloring it green) -->
                <div class="masked-icon w-6 h-6 flex items-center justify-center whatsapp-icon">
                    <i data-lucide="message-square-text" class="w-6 h-6"></i>
                </div>
            </div>
        </button>

        <!-- Button 3: Filled (Download PDF) with Download Icon -->
        <button class="btn-primary-btn-lg-wrapper w-full md:flex-1 h-13 py-2 px-6 rounded-lg overflow-hidden
                       flex flex-col items-center justify-center bg-primary-500
                       text-white font-medium text-lg shadow-lg hover:bg-indigo-600 transition duration-150 ease-in-out">
            <div class="btn-primary-btn-lg flex items-center gap-2">
                <!-- Text -->
                <div class="div text-right">تحميل الخطة PDF</div>
                <!-- Icon -->
                <div class="masked-icon w-6 h-6 flex items-center justify-center">
                    <i data-lucide="download" class="w-6 h-6 text-white"></i>
                </div>
            </div>
        </button>

    </div>

    <!-- Initialize Lucide icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
