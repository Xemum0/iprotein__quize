<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz</title>
  </head>
  <body>
    <main class="quiz-app" data-active-step="overview">
      <section class="AI-coach-quiz quiz-step is-active" data-step="overview" aria-live="polite">
        <header class="header">
          <div class="frame">
            <div class="div">
              <a class="icon-button" href="#" aria-label="إغلاق">
                <img class="remix-icons-line" src="../assets/images/close.svg" alt="" />
              </a>
            </div>
            <div class="logo-wrapper">
              <div class="logo">
                <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
              </div>
            </div>
            <div class="div"></div>
          </div>
        </header>
        <div class="frame-2">
          <div class="frame-3">
            <div class="frame-4">
              <div class="indicator">
                <span class="indicator-icon" aria-hidden="true">📅</span>
                <div class="div-2">
                  <div class="description-text">أيام التمرين</div>
                  <div class="text-wrapper">03</div>
                </div>
              </div>
              <div class="indicator-2">
                <span class="indicator-icon" aria-hidden="true">⏰</span>
                <div class="div-2">
                  <div class="description-text-2">المدة</div>
                  <div class="description-text-3">06 أشهر</div>
                </div>
              </div>
              <div class="indicator-3">
                <span class="indicator-icon" aria-hidden="true">🚀</span>
                <div class="div-2">
                  <div class="description-text-4">الهدف</div>
                  <div class="description-text-5">إنقاص الوزن</div>
                </div>
              </div>
              <div class="indicator-4">
                <span class="indicator-icon" aria-hidden="true">🔥</span>
                <div class="div-2">
                  <div class="description-text-6">السعرات الحرارية</div>
                  <div class="description-text-7">600</div>
                </div>
              </div>
            </div>
            <div class="frame-wrapper">
              <img class="frame-illustration" src="../assets/images/image.png" alt="مخطط التقدم اليومي" />
              <div class="frame-5" style="--progress-target: 85">
                <div class="div-wrapper">
                  <div class="frame-6"><div class="text-wrapper-2">85%</div></div>
                </div>
                <div class="frame-7">
                  <div class="text-wrapper-4">هدف اليوم</div>
                  <div class="text-wrapper-3">450 سعر حراري</div>
                </div>
              </div>
            </div>
          </div>
          <div class="frame-8">
            <div class="frame-9">
              <p class="p">ابدأ رحلة التحول نحو النسخة الأعظم من نفسك!</p>
              <p class="text-wrapper-5">
                أجب على بعض الأسئلة البسيطة، ودع iProtein يبني لك خطة تمرين، تغذية، ومكملات مصممة خصيصًا لهدفك وجسمك.
              </p>
            </div>
            <button
              class="button js-next-step"
              data-step-target="gender"
              data-animate="pulse"
              type="button"
              aria-label="ابدأ الاختبار"
            >
              <div class="btn-primary-btn-lg"><div class="button-2">ابدأ الآن</div></div>
            </button>
          </div>
        </div>
      </section>

      <section class="AI-coach-quiz-2 quiz-step" data-step="gender" aria-hidden="true">
        <header class="header">
          <div class="frame">
            <div class="remix-icons-line-wrapper">
              <button
                class="icon-button js-prev-step"
                type="button"
                data-step-target="overview"
                aria-label="عودة للخلف"
              >
                <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
              </button>
            </div>
            <div class="logo-wrapper">
              <div class="logo">
                <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
              </div>
            </div>
            <div class="remix-icons-line-wrapper">
              <a class="icon-button" href="#" aria-label="إغلاق">
                <img class="remix-icons-line" src="../assets/images/close.svg" alt="" />
              </a>
            </div>
          </div>
        </header>
        <div class="frame-2">
          <div class="frame-3">
            <div class="frame-4">
              <div class="text-wrapper">2%</div>
              <div class="text-wrapper-2">المعلومات الشخصية</div>
              <div class="text-wrapper">1/47</div>
            </div>
            <div class="progress-section">
              <div
                class="progress-bar"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="2"
                style="--progress-percent: 2%; --total-steps: 7"
              >
                <div class="progress-line">
                  <span class="progress-line-fill" aria-hidden="true"></span>
                </div>
                <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                </ol>
              </div>
            </div>
          </div>
          <div class="frame-6">
            <div class="text-wrapper-3">ما هو جنسك؟</div>
            <div class="frame-7">
              <div class="component">
                <button
                  class="button"
                  data-animate="pulse"
                  type="button"
                  data-gender-option="female"
                  data-next-url="./quize3.html?gender=female"
                  aria-label="اختر الجنس أنثى"
                >
                  <div class="btn-primary-btn-lg">
                    <div class="masked-icon">
                      <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                    </div>
                    <div class="button-2">أنثي</div>
                  </div>
                </button>
              </div>
              <div class="button-wrapper">
                <button
                  class="button"
                  data-animate="pulse"
                  type="button"
                  data-gender-option="male"
                  data-next-url="./quize3.html?gender=male"
                  aria-label="اختر الجنس ذكر"
                >
                  <div class="btn-primary-btn-lg">
                    <div class="masked-icon">
                      <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                    </div>
                    <div class="button-2">ذكر</div>
                  </div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
