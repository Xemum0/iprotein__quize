<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 12</title>
    <style>
      .sleep-quality-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .sleep-quality-progress-wrapper {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
      }

      .sleep-quality-progress {
        display: flex;
        justify-content: center;
        margin: 0 auto;
      }

      .sleep-quality-progress .progress-circle {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: conic-gradient(var(--progress-color, #294e3e) var(--progress-value, 0%), #deede7 0);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s ease;
      }

      .sleep-quality-progress .progress-circle::after {
        content: "";
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        background: #fff;
        z-index: 0;
      }

      .sleep-quality-progress .progress-circle-value {
        position: relative;
        z-index: 1;
        font-size: 28px;
        font-weight: 600;
        color: #294e3e;
      }

      .sleep-quality-floating-figure {
        position: fixed;
        right: 0;
        top: 0;
        width: clamp(130px, 20vw, 220px);
        pointer-events: none;
        z-index: 0;
      }

      .sleep-quality-floating-figure img {
        width: 100%;
        height: auto;
        display: block;
      }

      .sleep-quality-header {
        text-align: center;
      }

      .sleep-quality-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .sleep-quality-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        align-items: center;
      }

      .sleep-quality-option {
        width: min(26rem, 100%);
        height: 86px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: #fff;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 32px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        flex-direction: row;
        gap: 16px;
      }

      .sleep-quality-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .sleep-quality-option .quality-right-pack {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-direction: row;
      }

      .sleep-quality-option .quality-label {
        direction: rtl;
        line-height: 1.1;
      }

      .sleep-quality-option .quality-spacer {
        flex: 1;
      }

      .sleep-quality-option .quality-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .sleep-quality-option .quality-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .sleep-quality-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .sleep-quality-option.is-active .quality-checkbox {
        background: #294e3e;
      }

      .sleep-quality-option.is-active .quality-tick {
        opacity: 1;
        border-color: #fff;
      }

      .sleep-quality-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .sleep-quality-actions .button {
        width: min(320px, 100%);
      }

      .sleep-quality-actions .btn-primary-btn-lg {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize12.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">12/47</div>
            <div class="text-wrapper-2">الحالة الهرمونية والصحية</div>
            <div class="text-wrapper">26%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="26"
              style="--progress-percent: 26%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 sleep-quality-question" data-sleepquality-widget>
          <div class="sleep-quality-progress-wrapper">
            <div class="sleep-quality-progress" aria-live="polite">
              <div class="progress-circle" data-sleepquality-progress-circle>
                <span class="progress-circle-value" data-sleepquality-progress-value>0%</span>
              </div>
            </div>
          </div>
          <div class="sleep-quality-header">
            <p class="text-wrapper-3" data-sleepquality-title>كيف تقيمين جودة نومك؟</p>
            <p class="sleep-quality-description" data-sleepquality-description>
              ساعدينا على فهم جودة نومكِ لنضبط خطتكِ وفق احتياجاتكِ اليومية.
            </p>
          </div>
          <div class="sleep-quality-options">
            <button
              class="sleep-quality-option"
              type="button"
              data-quality-option="excellent"
              aria-pressed="false"
            >
              <div class="quality-right-pack">
                <span class="quality-label">ممتازة</span>
              </div>
              <div class="quality-spacer" aria-hidden="true"></div>
              <div class="quality-checkbox" aria-hidden="true">
                <div class="quality-tick"></div>
              </div>
            </button>
            <button
              class="sleep-quality-option"
              type="button"
              data-quality-option="average"
              aria-pressed="false"
            >
              <div class="quality-right-pack">
                <span class="quality-label">متوسطة</span>
              </div>
              <div class="quality-spacer" aria-hidden="true"></div>
              <div class="quality-checkbox" aria-hidden="true">
                <div class="quality-tick"></div>
              </div>
            </button>
            <button
              class="sleep-quality-option"
              type="button"
              data-quality-option="low"
              aria-pressed="false"
            >
              <div class="quality-right-pack">
                <span class="quality-label">ضعيفة</span>
              </div>
              <div class="quality-spacer" aria-hidden="true"></div>
              <div class="quality-checkbox" aria-hidden="true">
                <div class="quality-tick"></div>
              </div>
            </button>
          </div>
          <div class="sleep-quality-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize14.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-sleepquality-next
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <div class="sleep-quality-floating-figure" aria-hidden="true">
      <img src="../assets/images/question12/men.svg" alt="" data-sleepquality-figure />
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-sleepquality-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-quality-option]");
        const titleEl = widget.querySelector("[data-sleepquality-title]");
        const descriptionEl = widget.querySelector("[data-sleepquality-description]");
        const nextButton = widget.querySelector("[data-sleepquality-next]");
        const figureImg = document.querySelector("[data-sleepquality-figure]");
        const figureWrapper = figureImg?.closest(".sleep-quality-floating-figure");
        const progressWrapper = widget.querySelector(".sleep-quality-progress-wrapper");
        const progressCircle = widget.querySelector("[data-sleepquality-progress-circle]");
        const progressValue = widget.querySelector("[data-sleepquality-progress-value]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "كيف تقيم جودة نومك؟",
            description: "ساعدنا على فهم جودة نومك لنضبط خطتك بالشكل الأمثل.",
          },
          female: {
            title: "كيف تقيمين جودة نومك؟",
            description: "ساعدينا على فهم جودة نومكِ لنضبط خطتكِ بالشكل الأمثل.",
          },
        };

        const figureSources = {
          male: "../assets/images/question12/men.svg",
          female: "../assets/images/question12/female.svg",
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (currentCopy) {
            if (titleEl) titleEl.textContent = currentCopy.title;
            if (descriptionEl) descriptionEl.textContent = currentCopy.description;
          }
          if (figureImg) {
            const src = figureSources[gender] || figureSources.male;
            figureImg.setAttribute("src", src);
          }
        };

        const progressMap = {
          excellent: 100,
          average: 50,
          low: 25,
        };

        const progressColorMap = {
          excellent: "#294e3e",
          average: "#FFC107",
          low: "#F43E44",
        };

        const updateProgress = (value = 0, color = "#294e3e") => {
          if (!progressCircle || !progressValue) return;
          const clamped = Math.max(0, Math.min(100, Number(value) || 0));
          progressCircle.style.setProperty("--progress-value", `${clamped}%`);
          progressCircle.style.setProperty("--progress-color", color);
          progressValue.textContent = `${clamped}%`;
        };

        const syncFigurePosition = () => {
          if (!figureWrapper || !progressWrapper) return;
          const rect = progressWrapper.getBoundingClientRect();
          const top = Math.max(rect.bottom, 0);
          figureWrapper.style.top = `${top}px`;
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) {
            updateProgress(0);
            return;
          }
          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.selectedQuality = "";
            updateProgress(0);
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });
          selectedOption = button;
          widget.dataset.selectedQuality = button.dataset.qualityOption || "";
          const selectedKey = widget.dataset.selectedQuality || "";
          const value = progressMap[selectedKey] ?? 0;
          const color = progressColorMap[selectedKey] || "#294e3e";
          updateProgress(value, color);
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0] || null);
          }
        });
        window.addEventListener("resize", syncFigurePosition);
        window.addEventListener("scroll", syncFigurePosition, { passive: true });

        applyCopy();
        syncFigurePosition();
        updateProgress(0);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
