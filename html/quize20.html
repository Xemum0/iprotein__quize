<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 19</title>
    <style>
      .coffee-question {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        align-items: center;
        text-align: center;
      }

      .coffee-header {
        max-width: 520px;
      }

      .coffee-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .coffee-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: min(32rem, 100%);
        align-items: center;
      }

      .coffee-option {
        width: 100%;
        min-height: 88px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: transparent;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 28px;
        cursor: pointer;
        font-size: 18px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        gap: 16px;
      }

      .coffee-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .coffee-option .option-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .coffee-option .option-label {
        direction: rtl;
      }

      .coffee-option .option-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        padding: 8px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .coffee-option .option-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .coffee-option .option-spacer {
        flex: 1;
      }

      .coffee-option .option-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .coffee-option .option-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .coffee-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .coffee-option.is-active .option-icon {
        background: #deede7;
      }

      .coffee-option.is-active .option-checkbox {
        background: #294e3e;
      }

      .coffee-option.is-active .option-tick {
        opacity: 1;
        border-color: #fff;
      }

      .coffee-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .coffee-actions .button {
        width: min(320px, 100%);
      }

      .coffee-actions .btn-primary-btn-lg {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize19.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">19/47</div>
            <div class="text-wrapper-2">العادات الغذائية</div>
            <div class="text-wrapper">40%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="40"
              style="--progress-percent: 40%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 coffee-question" data-coffee-widget>
          <div class="coffee-header">
            <p class="text-wrapper-3" data-coffee-title>كم كوبًا من القهوة أو الشاي تشربين يوميًا؟</p>
            <p class="coffee-description" data-coffee-description>
              شاركينا عاداتك مع المشروبات المنبهة لنضبط خطتكِ بما يناسب نمطكِ اليومي.
            </p>
          </div>
          <div class="coffee-options">
            <button class="coffee-option" type="button" data-coffee-option="none" aria-pressed="false">
              <div class="option-right">
                <div class="option-icon" aria-hidden="true">
                  <img src="../assets/images/false.svg" alt="" />
                </div>
                <span class="option-label">لا أشرب</span>
              </div>
              <div class="option-spacer" aria-hidden="true"></div>
              <div class="option-checkbox" aria-hidden="true">
                <div class="option-tick"></div>
              </div>
            </button>
            <button class="coffee-option" type="button" data-coffee-option="one" aria-pressed="false">
              <div class="option-right">
                <div class="option-icon" aria-hidden="true">
                  <img src="../assets/images/coffee.svg" alt="" />
                </div>
                <span class="option-label">كوب واحد</span>
              </div>
              <div class="option-spacer" aria-hidden="true"></div>
              <div class="option-checkbox" aria-hidden="true">
                <div class="option-tick"></div>
              </div>
            </button>
            <button class="coffee-option" type="button" data-coffee-option="two" aria-pressed="false">
              <div class="option-right">
                <div class="option-icon" aria-hidden="true">
                  <img src="../assets/images/coffee.svg" alt="" />
                </div>
                <span class="option-label">كوبان</span>
              </div>
              <div class="option-spacer" aria-hidden="true"></div>
              <div class="option-checkbox" aria-hidden="true">
                <div class="option-tick"></div>
              </div>
            </button>
            <button class="coffee-option" type="button" data-coffee-option="three-four" aria-pressed="false">
              <div class="option-right">
                <div class="option-icon" aria-hidden="true">
                  <img src="../assets/images/coffee.svg" alt="" />
                </div>
                <span class="option-label">3–4 أكواب</span>
              </div>
              <div class="option-spacer" aria-hidden="true"></div>
              <div class="option-checkbox" aria-hidden="true">
                <div class="option-tick"></div>
              </div>
            </button>
            <button class="coffee-option" type="button" data-coffee-option="more" aria-pressed="false">
              <div class="option-right">
                <div class="option-icon" aria-hidden="true">
                  <img src="../assets/images/coffee.svg" alt="" />
                </div>
                <span class="option-label">أكثر من 4 أكواب</span>
              </div>
              <div class="option-spacer" aria-hidden="true"></div>
              <div class="option-checkbox" aria-hidden="true">
                <div class="option-tick"></div>
              </div>
            </button>
          </div>
          <div class="coffee-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize21.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-coffee-next
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-coffee-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-coffee-option]");
        const titleEl = widget.querySelector("[data-coffee-title]");
        const descriptionEl = widget.querySelector("[data-coffee-description]");
        const nextButton = widget.querySelector("[data-coffee-next]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "كم كوبًا من القهوة أو الشاي تشرب يوميًا؟",
            description: "شاركنا عاداتك مع المشروبات المنبهة لنضبط خطتك بما يناسب نمطك اليومي.",
          },
          female: {
            title: "كم كوبًا من القهوة أو الشاي تشربين يوميًا؟",
            description: "شاركينا عاداتكِ مع المشروبات المنبهة لنضبط خطتكِ بما يناسب نمطكِ اليومي.",
          },
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (!currentCopy) return;
          if (titleEl) titleEl.textContent = currentCopy.title;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) return;
          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.selectedCoffee = "";
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });
          selectedOption = button;
          widget.dataset.selectedCoffee = button.dataset.coffeeOption || "";
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0] || null);
          }
        });

        applyCopy();
      })();
    </script>
  </body>
</html>
