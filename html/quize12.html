<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 11</title>
    <style>
      .sleep-question {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
      }

      .sleep-layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      @media (min-width: 900px) {
        .sleep-layout {
          flex-direction: row;
          align-items: center;
        }
      }

      .sleep-card {
        flex: 1 1 50%;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .sleep-header {
        text-align: right;
      }

      .sleep-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .sleep-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .sleep-option {
        width: 100%;
        min-height: 92px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: #fff;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 28px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        gap: 16px;
      }

      .sleep-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .sleep-option .option-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .sleep-option .option-label {
        direction: rtl;
      }

      .sleep-option .option-spacer {
        flex: 1;
      }

      .sleep-option .option-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .sleep-option .option-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .sleep-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .sleep-option.is-active .option-icon {
        background: #deede7;
        box-shadow: inset 0 0 0 1px #294e3e0f;
      }

      .sleep-option.is-active .option-checkbox {
        background: #294e3e;
      }

      .sleep-option.is-active .option-tick {
        opacity: 1;
        border-color: #fff;
      }

      .sleep-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .sleep-actions .button {
        width: min(320px, 100%);
      }

      .sleep-figure {
        flex: 1 1 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .sleep-figure img {
        width: min(360px, 100%);
        height: auto;
        display: block;
        border-radius: 32px;
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize11.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">11/47</div>
            <div class="text-wrapper-2">الحالة الهرمونية والصحية</div>
            <div class="text-wrapper">23%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="23"
              style="--progress-percent: 23%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 sleep-question" data-sleep-widget>
          <div class="sleep-layout">
            <div class="sleep-card">
              <div class="sleep-header">
                <p class="text-wrapper-3" data-sleep-title>ما هو متوسط عدد ساعات نومك يوميًا؟</p>
                <p class="sleep-description" data-sleep-description>
                  أخبرنا بعدد ساعات نومك لنضبط جدولك الغذائي والتدريبي وفقًا لإيقاع حياتك.
                </p>
              </div>
              <div class="sleep-options">
                <button class="sleep-option" type="button" data-sleep-option="lt5" aria-pressed="false">
                  <div class="option-right">
                    <span class="option-label">أقل من 5 ساعات</span>
                  </div>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="sleep-option" type="button" data-sleep-option="5to6" aria-pressed="false">
                  <div class="option-right">
                    <span class="option-label">من 5 إلى 6 ساعات</span>
                  </div>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="sleep-option" type="button" data-sleep-option="7to8" aria-pressed="false">
                  <div class="option-right">
                    <span class="option-label">من 7 إلى 8 ساعات</span>
                  </div>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="sleep-option" type="button" data-sleep-option="gt8" aria-pressed="false">
                  <div class="option-right">
                    <span class="option-label">أكثر من 8 ساعات</span>
                  </div>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
              </div>
              <div class="sleep-actions">
                <a
                  class="button"
                  data-animate="pulse"
                  href="./quize13.html"
                  aria-label="الانتقال إلى السؤال التالي"
                  data-sleep-next
                >
                  <div class="btn-primary-btn-lg">
                    <div class="masked-icon">
                      <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                    </div>
                    <div class="button-2">التالي</div>
                  </div>
                </a>
              </div>
            </div>
            <div class="sleep-figure">
              <img src="../assets/images/sleep_man.svg" alt="" data-sleep-figure />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-sleep-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-sleep-option]");
        const nextButton = widget.querySelector("[data-sleep-next]");
        const titleEl = widget.querySelector("[data-sleep-title]");
        const descriptionEl = widget.querySelector("[data-sleep-description]");
        const figureImg = widget.querySelector("[data-sleep-figure]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "ما هو متوسط عدد ساعات نومك يوميًا؟",
            description: "أخبرنا بعدد ساعات نومك لنضبط جدولك الغذائي والتدريبي وفقًا لإيقاع حياتك.",
          },
          female: {
            title: "ما هو متوسط عدد ساعات نومكِ يوميًا؟",
            description: "أخبرينا بعدد ساعات نومكِ لنضبط جدولك الغذائي والتدريبي وفقًا لإيقاع حياتكِ.",
          },
        };

        const figureSources = {
          male: "../assets/images/sleep_man.svg",
          female: "../assets/images/sleep_women.svg",
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (currentCopy) {
            if (titleEl) titleEl.textContent = currentCopy.title;
            if (descriptionEl) descriptionEl.textContent = currentCopy.description;
          }
          if (figureImg) {
            const src = figureSources[gender] || figureSources.male;
            figureImg.setAttribute("src", src);
          }
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) return;
          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.sleepSelection = "";
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });
          selectedOption = button;
          widget.dataset.sleepSelection = button.dataset.sleepOption || "";
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0] || null);
          }
        });

        applyCopy();
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
