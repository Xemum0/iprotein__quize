<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 31</title>
    <style>
      .intensity-question {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .intensity-layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
      }

      @media (min-width: 900px) {
        .intensity-layout {
          flex-direction: row;
          align-items: stretch;
        }
      }

      .intensity-card {
        flex: 1 1 50%;
        display: flex;
        flex-direction: column;
        gap: 24px;
        background: #fff;
        border-radius: 24px;
        padding: clamp(20px, 3vw, 32px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      }

      .intensity-header {
        text-align: right;
      }

      .intensity-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .intensity-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }

      .intensity-option {
        width: 100%;
        min-height: 92px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: transparent;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 28px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        gap: 16px;
      }

      .intensity-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .option-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .option-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        padding: 8px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .option-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .option-label {
        direction: rtl;
      }

      .option-spacer {
        flex: 1;
      }

      .option-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        alignments: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .option-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .intensity-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .intensity-option.is-active .option-icon {
        background: #deede7;
      }

      .intensity-option.is-active .option-checkbox {
        background: #294e3e;
      }

      .intensity-option.is-active .option-tick {
        opacity: 1;
        border-color: #fff;
      }

      .intensity-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .intensity-actions .button {
        width: min(320px, 100%);
      }

      .intensity-actions .btn-primary-btn-lg {
        width: 100%;
      }

      .intensity-figure {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .intensity-figure img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 899px) {
        .intensity-card {
          flex: 1 1 auto;
        }

        .intensity-figure {
          align-self: center;
          width: min(360px, 100%);
        }
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize31.html" aria-label="عودة إلى السؤال السابق" data-intensity-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">31/47</div>
            <div class="text-wrapper-2">عادات التمرين</div>
            <div class="text-wrapper">66%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="66"
              style="--progress-percent: 66%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 intensity-question" data-intensity-widget>
          <div class="intensity-layout">
            <div class="intensity-card">
              <div class="intensity-header">
                <p class="text-wrapper-3" data-intensity-title>ما شدة تمرينك عادة؟</p>
                <p class="intensity-description" data-intensity-description>
                  اختر مستوى الشدة الأقرب لتمارينك المعتادة لنساعدك في ضبط الحمل التدريبي.
                </p>
              </div>
              <div class="intensity-options">
                <button class="intensity-option" type="button" data-intensity-option="light" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon">
                      <img src="../assets/images/question31/low.svg" alt="" />
                    </div>
                    <span class="option-label">خفيف</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="intensity-option" type="button" data-intensity-option="moderate" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon">
                      <img src="../assets/images/question31/mid.svg" alt="" />
                    </div>
                    <span class="option-label">متوسط</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="intensity-option" type="button" data-intensity-option="intense" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon">
                      <img src="../assets/images/question31/max.svg" alt="" />
                    </div>
                    <span class="option-label">عالي الشدة</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
              </div>
              <div class="intensity-actions">
                <a
                  class="button"
                  data-animate="pulse"
                  href="./quize33.html"
                  aria-label="الانتقال إلى السؤال التالي"
                  data-intensity-next
                >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                  <div class="button-2">التالي</div>
                </div>
              </a>
              </div>
            </div>
            <div class="intensity-figure">
              <img src="../assets/images/question31/women.svg" alt="متدربة تمارس تمرينًا" data-intensity-figure />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-intensity-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-intensity-option]"));
        const nextButton = widget.querySelector("[data-intensity-next]");
        const titleEl = widget.querySelector("[data-intensity-title]");
        const descriptionEl = widget.querySelector("[data-intensity-description]");
        const figureImg = widget.querySelector("[data-intensity-figure]");
        const genderLinks = document.querySelectorAll("[data-intensity-gender-link]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "ما شدة تمرينك عادة؟",
            description: "اختر مستوى الشدة الأقرب لتمارينك لنساعدك في ضبط الحمل التدريبي.",
            figure: "../assets/images/question31/men.svg",
            figureAlt: "متدرب يمارس تمرينًا",
          },
          female: {
            title: "ما شدة تمرينك عادة؟",
            description: "اختاري مستوى الشدة الأقرب لتمارينك لنضبط الحمل التدريبي بدقة.",
            figure: "../assets/images/question31/women.svg",
            figureAlt: "متدربة تمارس تمرينًا",
          },
        };

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const url = new URL(href, window.location.href);
          url.searchParams.set("gender", gender);
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (!currentCopy) return;
          if (titleEl) titleEl.textContent = currentCopy.title;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
          if (figureImg) {
            figureImg.src = currentCopy.figure;
            figureImg.alt = currentCopy.figureAlt || "";
          }
        };

        const selected = new Set();

        const updateDataset = () => {
          widget.dataset.selectedIntensity = Array.from(selected).join(",");
        };

        const toggleOption = (option) => {
          if (!option) return;
          const key = option.dataset.intensityOption;
          if (selected.has(key)) {
            selected.delete(key);
            option.classList.remove("is-active");
            option.setAttribute("aria-pressed", "false");
          } else {
            selected.clear();
            widget.querySelectorAll(".intensity-option.is-active").forEach((active) => {
              active.classList.remove("is-active");
              active.setAttribute("aria-pressed", "false");
            });
            selected.add(key);
            option.classList.add("is-active");
            option.setAttribute("aria-pressed", "true");
          }
          updateDataset();
        };

        options.forEach((option) => {
          option.addEventListener("click", () => toggleOption(option));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selected.size) {
            event.preventDefault();
            const first = options[0];
            if (first) toggleOption(first);
          }
        });

        applyCopy();
        genderLinks.forEach(applyGenderToLink);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
