<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 22</title>

    <style>
      .eatout-question {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .eatout-layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
      }

      @media (min-width: 900px) {
        .eatout-layout {
          flex-direction: row;
          align-items: stretch;
        }
      }

      .eatout-card {
        flex: 1 1 50%;
        display: flex;
        flex-direction: column;
        gap: 24px;
        background: #fff;
        border-radius: 24px;
        padding: clamp(20px, 3vw, 32px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      }

      .eatout-header {
        text-align: right;
      }

      .eatout-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .eatout-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }

      .eatout-option {
        width: 100%;
        min-height: 92px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: transparent;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 28px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        gap: 16px;
      }

      .eatout-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .option-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .option-label {
        direction: rtl;
      }

      .option-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        padding: 8px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .option-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .option-spacer {
        flex: 1;
      }

      .option-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .option-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .eatout-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .eatout-option.is-active .option-icon {
        background: #deede7;
      }

      .eatout-option.is-active .option-checkbox {
        background: #294e3e;
      }

      .eatout-option.is-active .option-tick {
        opacity: 1;
        border-color: #fff;
      }

      .eatout-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .eatout-actions .button {
        width: min(320px, 100%);
      }

      .eatout-actions .btn-primary-btn-lg {
        width: 100%;
      }

      .eatout-figure {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .eatout-figure img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 899px) {
        .eatout-card {
          flex: 1 1 auto;
        }

        .eatout-figure {
          align-self: center;
          width: min(360px, 100%);
        }
      }
    </style>
  </head>

  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize22.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>

      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">22/47</div>
            <div class="text-wrapper-2">العادات الغذائية</div>
            <div class="text-wrapper">47%</div>
          </div>

          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="47"
              style="--progress-percent: 47%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                <li class="progress-step completed"><span class="progress-node"></span></li>
                <li class="progress-step completed"><span class="progress-node"></span></li>
                <li class="progress-step completed"><span class="progress-node"></span></li>
                <li class="progress-step"><span class="progress-node"></span></li>
                <li class="progress-step"><span class="progress-node"></span></li>
                <li class="progress-step"><span class="progress-node"></span></li>
                <li class="progress-step"><span class="progress-node"></span></li>
              </ol>
            </div>
          </div>
        </div>

        <div class="frame-6 eatout-question">
          <div class="eatout-layout">
            <div class="eatout-card" data-eatout-widget>
              <div class="eatout-header">
                <p class="text-wrapper-3" data-eatout-title>كم مرة تأكلين في المطاعم أسبوعيًا؟</p>
                <p class="eatout-description" data-eatout-description>
                  معرفة عدد وجباتك خارج المنزل يساعدنا على ضبط خطتكِ الغذائية بشكل واقعي.
                </p>
              </div>

              <div class="eatout-options">
                <button class="eatout-option" data-eatout-option="none">
                  <div class="option-right">
                    <div class="option-icon"><img src="../assets/images/false.svg" alt="" /></div>
                    <span class="option-label">لا آكل في المطاعم</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>

                <button class="eatout-option" data-eatout-option="one">
                  <div class="option-right">
                    <div class="option-icon"><img src="../assets/images/junk.svg" alt="" /></div>
                    <span class="option-label">مرة واحدة</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>

                <button class="eatout-option" data-eatout-option="two-three">
                  <div class="option-right">
                    <div class="option-icon"><img src="../assets/images/junk.svg" alt="" /></div>
                    <span class="option-label">2–3 مرات</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>

                <button class="eatout-option" data-eatout-option="four-five">
                  <div class="option-right">
                    <div class="option-icon"><img src="../assets/images/junk.svg" alt="" /></div>
                    <span class="option-label">4–5 مرات</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>

                <button class="eatout-option" data-eatout-option="more">
                  <div class="option-right">
                    <div class="option-icon"><img src="../assets/images/junk.svg" alt="" /></div>
                    <span class="option-label">أكثر من 5 مرات</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>
              </div>

              <div class="eatout-actions">
                <a class="button" href="./quize24.html" data-eatout-next>
                  <div class="btn-primary-btn-lg">
                    <div class="masked-icon">
                      <img src="../assets/images/arrow-left-line.svg" alt="" />
                    </div>
                    <div class="button-2">التالي</div>
                  </div>
                </a>
              </div>
            </div>

            <div class="eatout-figure">
              <img src="../assets/images/eatout.svg" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const widget = document.querySelector("[data-eatout-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-eatout-option]");
        const titleEl = widget.querySelector("[data-eatout-title]");
        const descriptionEl = widget.querySelector("[data-eatout-description]");
        const nextButton = widget.querySelector("[data-eatout-next]");

        const params = new URLSearchParams(window.location.search);
        const gender =
          (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "كم مرة تأكل في المطاعم أسبوعيًا؟",
            description:
              "معرفة عدد وجباتك خارج المنزل يساعدنا على ضبط خطتك الغذائية بشكل واقعي.",
          },
          female: {
            title: "كم مرة تأكلين في المطاعم أسبوعيًا؟",
            description:
              "معرفة عدد وجباتكِ خارج المنزل يساعدنا على ضبط خطتكِ الغذائية بشكل واقعي.",
          },
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (!currentCopy) return;
          titleEl.textContent = currentCopy.title;
          descriptionEl.textContent = currentCopy.description;
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) return;

          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.selectedEatout = "";
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });

          selectedOption = button;
          widget.dataset.selectedEatout = button.dataset.eatoutOption || "";
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0]);
          }
        });

        applyCopy();
      })();
    </script>

    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
