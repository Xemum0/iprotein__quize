<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 42</title>
    <style>
      .goals-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
      }

      .goals-header {
        text-align: center;
        max-width: 640px;
        margin: 0 auto;
      }

      .goals-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .goals-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        width: 100%;
      }

      @media (max-width: 640px) {
        .goals-grid {
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
      }

      .goal-option {
        border: 2px solid #d5e2db;
        border-radius: 18px;
        background: #fff;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        cursor: pointer;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        position: relative;
      }

      .goal-option:focus-visible {
        outline: 3px solid #7cc5a7;
        outline-offset: 2px;
      }

      .goal-option .option-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .goal-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #eef6f3;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .goal-icon img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      .goal-label {
        font-size: 1.1rem;
        font-weight: 700;
        color: #1f2933;
      }

      .goal-option .option-checkbox {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: 2px solid #294e3e;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 50%;
        left: 18px;
        transform: translateY(-50%);
        background: #fff;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .goal-option .option-checkbox::after {
        content: "";
        width: 12px;
        height: 7px;
        border-left: 2px solid transparent;
        border-bottom: 2px solid transparent;
        transform: rotate(-45deg);
        transition: border-color 0.25s ease;
      }

      .goal-option.is-active {
        border-color: #294e3e;
        background: #f3f8f6;
        box-shadow: 0 12px 30px rgba(39, 76, 62, 0.08);
      }

      .goal-option.is-active .option-checkbox {
        background: #294e3e;
        border-color: #294e3e;
      }

      .goal-option.is-active .option-checkbox::after {
        border-color: #fff;
      }

      .goals-other-field {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 12px 0;
      }

      .goals-other-field .input-outlined {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .goals-other-field .form-control {
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        border: 1px solid var(--primitives-colors-natural-natural-200, #d5e2db);
        background-color: #fff;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }

      .goals-other-field .text-field {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 16px;
        position: relative;
      }

      .goals-other-field .form-label {
        position: absolute;
        top: -11px;
        inset-inline-start: 16px;
        padding: 0 8px;
        background-color: #fff;
        border-radius: 4px;
        display: inline-flex;
        justify-content: flex-end;
      }

      .goals-other-field .label-text {
        font-size: 12px;
        color: var(--primitives-colors-primary-primary-950, #0a3524);
        text-align: right;
        direction: rtl;
        font-weight: 600;
      }

      .goals-other-field .input-text {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        width: 100%;
      }

      .goals-other-field .input-text-2 {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-size: 16px;
        font-family: "IBM Plex Sans Arabic", Helvetica, sans-serif;
        color: var(--primitives-colors-primary-primary-950, #0a3524);
        text-align: right;
        direction: rtl;
      }

      .goals-other-field.is-active .form-control {
        border-color: #294e3e;
        box-shadow: 0 8px 20px rgba(39, 76, 62, 0.12);
      }

      .goals-next-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        align-self: center;
        margin: 12px 0;
      }

      .goals-next-cell .button {
        width: min(320px, 100%);
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize42.html" aria-label="عودة إلى السؤال السابق" data-goals-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">42/47</div>
            <div class="text-wrapper-2">الاهداف الطموحات</div>
            <div class="text-wrapper">89%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="89"
              style="--progress-percent: 89%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 goals-question" data-goals-widget>
          <div class="goals-header">
            <p class="text-wrapper-3" data-goals-title>ما الذي تريدين تحقيقه بالضبط؟</p>
            <p class="goals-description" data-goals-description>
              اختاري أو اكتب الهدف الرئيسي الذي تسعين إليه حتى نصمم برنامجاً يناسب طموحك تماماً.
            </p>
          </div>
          <div class="goals-grid">
            <button class="goal-option" type="button" data-goal-option="healthy-weight" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="goal-icon">
                  <img src="../assets/images/question42/healthyweight.svg" alt="الوصول إلى وزن صحي" />
                </div>
                <span class="goal-label">أريد الوصول إلى وزن صحي</span>
              </div>
            </button>
            <button class="goal-option" type="button" data-goal-option="muscle" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="goal-icon">
                  <img src="../assets/images/question42/muscle.svg" alt="زيادة الكتلة العضلية" />
                </div>
                <span class="goal-label">أريد زيادة الكتلة العضلية</span>
              </div>
            </button>
            <button class="goal-option" type="button" data-goal-option="toned" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="goal-icon">
                  <img src="../assets/images/question42/mashdod.svg" alt="الحصول على جسم مشدود ومتناسق" data-goals-toned-icon />
                </div>
                <span class="goal-label">أريد الحصول على جسم مشدود ومتناسق</span>
              </div>
            </button>
            <button class="goal-option" type="button" data-goal-option="endurance" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="goal-icon">
                  <img src="../assets/images/question42/runing.svg" alt="تحسين اللياقة والتحمل" />
                </div>
                <span class="goal-label">أريد تحسين مستواي اللياقة والتحمل</span>
              </div>
            </button>
            <button class="goal-option" type="button" data-goal-option="energy" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="goal-icon">
                  <img src="../assets/images/question42/battery.svg" alt="اكتساب طاقة وحيوية" />
                </div>
                <span class="goal-label">أريد اكتساب طاقة وحيوية أكثر في حياتي اليومية</span>
              </div>
            </button>
            <button class="goal-option" type="button" data-goal-option="appearance" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="goal-icon">
                  <img src="../assets/images/question42/star.svg" alt="تحسين المظهر والثقة بالنفس" />
                </div>
                <span class="goal-label">أريد تحسين مظهري وزيادة الثقة بالنفس</span>
              </div>
            </button>
            <div class="goals-other-field" data-goal-option="other" role="group" aria-pressed="false">
              <div class="input-outlined">
                <div class="form-control">
                  <div class="text-field">
                    <div class="form-label">
                      <div class="label-text">أخرى</div>
                    </div>
                    <div class="input-text">
                      <input
                        class="input-text-2"
                        type="text"
                        placeholder="اكتبي هدفك"
                        data-goals-other
                        aria-label="اذكري هدفك الآخر"
                        data-goals-other-input
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="goals-next-cell">
              <a
                class="button"
                data-animate="pulse"
                href="./quize44.html"
                aria-label="الانتقال إلى السؤال التالي"
                data-goals-next
                data-goals-gender-link
              >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                  <div class="button-2">التالي</div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-goals-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-goal-option]"));
        const nextButton = widget.querySelector("[data-goals-next]");
        const titleEl = widget.querySelector("[data-goals-title]");
        const descriptionEl = widget.querySelector("[data-goals-description]");
        const tonedIcon = widget.querySelector("[data-goals-toned-icon]");
        const otherOption = widget.querySelector("[data-goal-option='other']");
        const otherInput = widget.querySelector("[data-goals-other]");
        const genderLinks = document.querySelectorAll("[data-goals-gender-link]");

        const params = new URLSearchParams(window.location.search);
        const genderParam = (params.get("gender") || "").toLowerCase();
        const gender = genderParam === "female" ? "female" : "male";

        const copy = {
          female: {
            title: "ما الذي تريدين تحقيقه بالضبط؟",
            description: "اختاري أو اكتبي الهدف الرئيسي الذي تسعين إليه حتى نصمم برنامجاً يناسب طموحك تماماً.",
          },
          male: {
            title: "ما الذي تريد تحقيقه بالضبط؟",
            description: "اختر أو اكتب الهدف الرئيسي الذي تسعى إليه حتى نصمم برنامجاً يناسب طموحك تماماً.",
          },
        };

        const otherFieldCopy = {
          female: {
            placeholder: "اكتبي هدفك",
            ariaLabel: "اذكري هدفك الآخر",
          },
          male: {
            placeholder: "اكتب هدفك",
            ariaLabel: "اذكر هدفك الآخر",
          },
        };

        const tonedIcons = {
          female: {
            src: "../assets/images/question42/mashdod.svg",
            alt: "الحصول على جسم مشدود ومتناسق",
          },
          male: {
            src: "../assets/images/question42/mashdodmen.svg",
            alt: "الحصول على جسم مشدود ومتناسق",
          },
        };

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const url = new URL(href, window.location.href);
          if (gender === "female") {
            url.searchParams.set("gender", "female");
          } else {
            url.searchParams.delete("gender");
          }
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };

        const applyCopy = () => {
          const data = copy[gender];
          if (titleEl) titleEl.textContent = data.title;
          if (descriptionEl) descriptionEl.textContent = data.description;
          const toned = tonedIcons[gender];
          if (tonedIcon && toned) {
            tonedIcon.src = toned.src;
            tonedIcon.alt = toned.alt;
          }
          const otherCopy = otherFieldCopy[gender];
          if (otherInput && otherCopy) {
            otherInput.placeholder = otherCopy.placeholder;
            otherInput.setAttribute("aria-label", otherCopy.ariaLabel);
          }
        };

        const selected = new Set();

        const updateDataset = () => {
          widget.dataset.selectedGoals = Array.from(selected).join(",");
        };

        const toggleOption = (option) => {
          if (!option) return;
          const key = option.dataset.goalOption;
          if (!key || key === "other") return;

          if (selected.has(key)) {
            selected.delete(key);
            option.classList.remove("is-active");
            option.setAttribute("aria-pressed", "false");
          } else {
            selected.add(key);
            option.classList.add("is-active");
            option.setAttribute("aria-pressed", "true");
          }

          updateDataset();
        };

        options.forEach((option) => {
          const key = option.dataset.goalOption;
          if (key === "other") {
            option.addEventListener("click", () => otherInput?.focus());
          } else {
            option.addEventListener("click", () => toggleOption(option));
          }
        });

        otherInput?.addEventListener("input", () => {
          const value = otherInput.value.trim();
          if (value) {
            selected.add("other");
            otherOption?.classList.add("is-active");
            otherOption?.setAttribute("aria-pressed", "true");
          } else {
            selected.delete("other");
            otherOption?.classList.remove("is-active");
            otherOption?.setAttribute("aria-pressed", "false");
          }
          updateDataset();
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selected.size) {
            event.preventDefault();
            const first = options.find((option) => option.dataset.goalOption !== "other");
            if (first) toggleOption(first);
          }
        });

        applyCopy();
        genderLinks.forEach(applyGenderToLink);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
