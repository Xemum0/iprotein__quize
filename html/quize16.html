<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 15</title>
    <style>
      .meal-question {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .meal-layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
      }

      @media (min-width: 900px) {
        .meal-layout {
          flex-direction: row;
          align-items: stretch;
        }
      }

      .meal-card {
        flex: 1 1 50%;
        display: flex;
        flex-direction: column;
        gap: 24px;
        background: #fff;
        border-radius: 24px;
        padding: clamp(20px, 3vw, 32px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      }

      .meal-header {
        text-align: right;
      }

      .meal-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .meal-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }

      .meal-option {
        width: 100%;
        min-height: 92px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: transparent;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 28px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      }

      .meal-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .meal-option .option-label {
        direction: rtl;
      }

      .meal-option .option-spacer {
        flex: 1;
      }

      .meal-option .option-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .meal-option .option-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .meal-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .meal-option.is-active .option-checkbox {
        background: #294e3e;
      }

      .meal-option.is-active .option-tick {
        opacity: 1;
        border-color: #fff;
      }

      .meal-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .meal-actions .button {
        width: min(320px, 100%);
      }

      .meal-actions .btn-primary-btn-lg {
        width: 100%;
      }

      .meal-figure {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .meal-figure img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 899px) {
        .meal-card {
          flex: 1 1 auto;
        }

        .meal-figure {
          align-self: center;
          width: min(360px, 100%);
        }
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize15.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">15/47</div>
            <div class="text-wrapper-2">العادات الغذائية</div>
            <div class="text-wrapper">32%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="32"
              style="--progress-percent: 32%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 meal-question">
          <div class="meal-layout">
            <div class="meal-card" data-meal-widget>
              <div class="meal-header">
                <p class="text-wrapper-3" data-meal-title>كم وجبة تتناولين يوميًا؟</p>
                <p class="meal-description" data-meal-description>
                  عدد الوجبات اليومية يساعدنا على فهم روتينك الغذائي وتوزيع السعرات.
                </p>
              </div>
              <div class="meal-options">
                <button class="meal-option" type="button" data-meal-option="one" aria-pressed="false">
                  <span class="option-label">وجبة واحدة</span>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="meal-option" type="button" data-meal-option="two" aria-pressed="false">
                  <span class="option-label">وجبتان</span>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="meal-option" type="button" data-meal-option="three" aria-pressed="false">
                  <span class="option-label">ثلاث وجبات</span>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="meal-option" type="button" data-meal-option="more" aria-pressed="false">
                  <span class="option-label">أكثر من ثلاث وجبات</span>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
              </div>
              <div class="meal-actions">
                <a
                  class="button"
                  data-animate="pulse"
                  href="./quize17.html"
                  aria-label="الانتقال إلى السؤال التالي"
                  data-meal-next
                >
                  <div class="btn-primary-btn-lg">
                    <div class="masked-icon">
                      <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                    </div>
                    <div class="button-2">التالي</div>
                  </div>
                </a>
              </div>
            </div>
            <div class="meal-figure" aria-hidden="true">
              <img src="../assets/images/meal.svg" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-meal-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-meal-option]");
        const titleEl = widget.querySelector("[data-meal-title]");
        const descriptionEl = widget.querySelector("[data-meal-description]");
        const nextButton = widget.querySelector("[data-meal-next]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "كم وجبة تتناول يوميًا؟",
            description: "عدد الوجبات اليومية يساعدنا على فهم روتينك الغذائي وتوزيع السعرات.",
          },
          female: {
            title: "كم وجبة تتناولين يوميًا؟",
            description: "عدد الوجبات اليومية يساعدنا على فهم روتينكِ الغذائي وتوزيع السعرات.",
          },
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (!currentCopy) return;
          if (titleEl) titleEl.textContent = currentCopy.title;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) return;
          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.selectedMeal = "";
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });
          selectedOption = button;
          widget.dataset.selectedMeal = button.dataset.mealOption || "";
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0] || null);
          }
        });

        applyCopy();
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
