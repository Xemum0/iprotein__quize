<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 17</title>
    <style>
      .meal-selection {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
        align-items: center;
      }

      .meal-selection-header {
        max-width: 640px;
        text-align: center;
      }

      .meal-selection-header .question-title {
        font-family: "IBM Plex Sans Arabic", "Cairo", sans-serif;
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 600;
        color: #17271f;
        margin: 0;
      }

      .meal-selection-header .question-subtitle {
        color: #6b7280;
        margin-top: 8px;
        font-size: 1rem;
      }

      .meal-options {
        width: 100%;
        display: flex;
        gap: 24px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .meal-option {
        width: 292px;
        height: 300px;
        border-radius: 16px;
        background: #eef6f3;
        border: 2px solid transparent;
        padding: 16px 24px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        position: relative;
        cursor: pointer;
        overflow: hidden;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .meal-option:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(23, 39, 31, 0.12);
      }

      .meal-option.is-active {
        border-color: #294e3e;
        box-shadow: 0 14px 30px rgba(23, 39, 31, 0.16);
      }

      .meal-option img {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 32px);
        height: 220px;
        object-fit: cover;
        border-radius: 12px;
      }

      .meal-option-label {
        width: 100%;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #7cc5a7;
        padding: 12px 24px;
        text-align: center;
        font-size: 1.05rem;
        font-weight: 600;
        color: #294e3e;
        position: relative;
        z-index: 1;
      }

      .meal-actions {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .meal-actions .button {
        width: min(320px, 100%);
      }

      @media (max-width: 768px) {
        .meal-options {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
          justify-items: center;
        }

        .meal-option {
          width: 100%;
          max-width: 220px;
          height: 260px;
        }

        .meal-option:last-child {
          grid-column: 1 / -1;
          justify-self: center;
        }

        .meal-option img {
          width: 90%;
          height: 180px;
        }

        .meal-option-label {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize16.html" aria-label="عودة إلى السؤال السابق" data-meals-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">17/47</div>
            <div class="text-wrapper-2">العادات الغذائية</div>
            <div class="text-wrapper">36%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="36"
              style="--progress-percent: 36%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 meal-selection" data-meal-selection>
          <div class="meal-selection-header">
            <p class="question-title" data-meal-question>كم وجبة رئيسية تتناولين يوميا؟</p>
            <p class="question-subtitle" data-meal-description>
              اختاري الوجبات التي تحرصين على تناولها يومياً حتى نوزع السعرات والبروتين بالطريقة المناسبة.
            </p>
          </div>
          <div class="meal-options">
            <button class="meal-option" type="button" data-meal-option="dinner" aria-pressed="false">
              <img src="../assets/images/question16/meal1.svg" alt="العشاء" />
              <span class="meal-option-label">العشاء</span>
            </button>
            <button class="meal-option" type="button" data-meal-option="lunch" aria-pressed="false">
              <img src="../assets/images/question16/meal2.svg" alt="الغداء" />
              <span class="meal-option-label">الغداء</span>
            </button>
            <button class="meal-option" type="button" data-meal-option="breakfast" aria-pressed="false">
              <img src="../assets/images/question16/meal3.svg" alt="الفطور" />
              <span class="meal-option-label">الفطور</span>
            </button>
          </div>
          <div class="meal-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize18.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-meal-next
              data-meals-gender-link
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-meal-selection]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-meal-option]"));
        const nextButton = widget.querySelector("[data-meal-next]");
        const questionEl = widget.querySelector("[data-meal-question]");
        const descriptionEl = widget.querySelector("[data-meal-description]");
        const genderLinks = document.querySelectorAll("[data-meals-gender-link]");

        const params = new URLSearchParams(window.location.search);
        const genderParam = (params.get("gender") || "").toLowerCase();
        const gender = genderParam === "female" ? "female" : "male";

        const copy = {
          female: {
            question: "كم وجبة رئيسية تتناولين يومياً؟",
            description: "اختاري الوجبات التي تحرصين على تناولها يومياً حتى نوزع السعرات والبروتين بالطريقة المناسبة."
          },
          male: {
            question: "كم وجبة رئيسية تتناول يومياً؟",
            description: "اختر الوجبات التي تحرص على تناولها يومياً حتى نوزع السعرات والبروتين بالطريقة المناسبة."
          }
        };

        const selected = new Set();

        const updateDataset = () => {
          widget.dataset.selectedMeals = Array.from(selected).join(",");
        };

        const toggleOption = (option) => {
          if (!option) return;
          const key = option.dataset.mealOption;
          if (selected.has(key)) {
            selected.delete(key);
            option.classList.remove("is-active");
            option.setAttribute("aria-pressed", "false");
          } else {
            selected.add(key);
            option.classList.add("is-active");
            option.setAttribute("aria-pressed", "true");
          }
          updateDataset();
        };

        options.forEach((option) => {
          option.addEventListener("click", () => toggleOption(option));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selected.size) {
            event.preventDefault();
            const first = options[0];
            if (first) toggleOption(first);
          }
        });

        const currentCopy = copy[gender];
        if (currentCopy) {
          if (questionEl) questionEl.textContent = currentCopy.question;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
        }

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const url = new URL(href, window.location.href);
          if (gender === "female") {
            url.searchParams.set("gender", "female");
          } else {
            url.searchParams.delete("gender");
          }
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };

        genderLinks.forEach(applyGenderToLink);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
