<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Step 3</title>
    <style>
      .quiz-name-screen {
        position: relative;
        overflow: hidden;
      }

      .quiz-name-floating-figure {
        position: fixed;
        right: 0;
        top: clamp(260px, 32vh, 400px);
        width: clamp(100px, 15vw, 160px);
        pointer-events: none;
        z-index: 1;
      }

      .quiz-name-floating-figure img {
        width: 100%;
        height: auto;
        display: block;
      }

      .quiz-name-section {
        position: relative;
        z-index: 1;
      }

      .input-error {
        display: none;
        background: var(--primitives-colors-error-error-100, #fcdede);
        color: var(--primitives-colors-error-error-600, #c10b11);
        border: 1px solid var(--primitives-colors-error-error-600, #c10b11);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.95rem;
        direction: rtl;
        text-align: right;
      }

      .input-error.is-visible {
        display: block;
      }

      .form-control.is-error {
        border-color: var(--primitives-colors-error-error-600, #c10b11);
        box-shadow: 0 0 0 1px rgba(193, 11, 17, 0.15);
      }

      .quiz-name-content {
        justify-content: center;
        align-items: center;
      }

      .quiz-name-form {
        margin-inline: auto;
      }

      @media (max-width: 1024px) {
        .quiz-name-floating-figure {
          position: absolute;
          right: 16px;
          top: 300px;
          width: clamp(90px, 22vw, 140px);
          z-index: 1;
        }
      }

      @media (max-width: 768px) {
        .quiz-name-floating-figure {
          grid-area: figure;
          position: relative;
          width: 100%;
          max-width: none;
          margin: 0;
          justify-self: stretch;
          align-self: flex-start;
          display: flex;
          align-items: flex-start;
          justify-content: flex-start;
          z-index: 1;
        }

        .quiz-name-screen .frame-2 {
          display: grid;
          grid-template-areas:
            "progress progress"
            "figure section";
          grid-template-columns: minmax(160px, 44vw) 1fr;
          gap: 12px;
          padding-inline-start: 0; /* let figure touch right edge */
          padding-inline-end: 16px;
          align-items: start;
        }

        .quiz-name-screen .frame-3 {
          grid-area: progress;
        }

        .quiz-name-screen .quiz-name-section {
          grid-area: section;
          padding-top: 0;
          align-items: flex-start;
          gap: 16px;
        }

        .quiz-name-screen .quiz-name-content {
          width: 100%;
          align-items: flex-start;
          justify-content: flex-start;
          gap: 16px;
          flex-wrap: nowrap;
        }

        .quiz-name-screen .frame-6 {
          align-items: flex-start;
          gap: 16px;
        }

        .quiz-name-screen .quiz-name-figure {
          width: 100%;
          height: auto;
          display: block;
        }

        .quiz-name-screen .quiz-name-section .text-wrapper-3 {
          text-align: right;
          width: 100%;
        }

        .quiz-name-section {
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <div
      class="AI-coach-quiz-2 quiz-name-screen"
      data-gender-context
      data-default-gender="male"
      data-question-number="2"
    >
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize2.html" aria-label="عودة إلى الخطوة السابقة">
              <img
                class="remix-icons-line"
                src="../assets/images/arrow-right-s-line.svg"
                alt=""
              />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">2/47</div>
            <div class="text-wrapper-2">المعلومات الشخصية</div>
            <div class="text-wrapper">4%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="4"
              style="--progress-percent: 4%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                <li class="progress-step completed">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="quiz-name-floating-figure" aria-hidden="true">
          <img
            class="quiz-name-figure"
            src="../assets/images/male1.svg"
            alt="متدرب من iProtein"
            loading="lazy"
            data-gender-figure
          />
        </div>
        <div class="frame-6 quiz-name-section">
          <div class="text-wrapper-3" data-gender-headline>
            أدخل اسمك لنخصص لك التجربة بما يناسبك
          </div>
          <div class="quiz-name-content">
            <form class="quiz-name-form" data-prevent-submit data-name-step>
              <div class="input-outlined">
                <div class="form-control">
                  <div class="text-field">
                    <div class="form-label">
                      <div class="label-text">ما اسمك الكامل؟</div>
                    </div>
                    <div class="content">
                      <div class="input-text">
                        <input
                          class="input-text-2"
                          type="text"
                          name="fullName"
                          placeholder="الاسم"
                          data-gender-input
                          aria-label="ما اسمك الكامل؟"
                          required
                        />
                      </div>
                    </div>
                    <img class="remix-icons-line" src="../assets/images/user-line.svg" alt="" />
                  </div>
                </div>
              </div>
              <div class="input-error" data-name-error aria-live="polite" hidden></div>
              <button
                class="button"
                type="submit"
                data-animate="pulse"
                data-name-submit
                data-next-url="./quize4.html"
              >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img
                      class="remix-icons-line-2"
                      src="../assets/images/arrow-left-line.svg"
                      alt=""
                    />
                  </div>
                  <div class="button-2">التالي</div>
                </div>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const form = document.querySelector("[data-name-step]");
        if (!form) return;
        const input = form.querySelector('input[name="fullName"]');
        const errorEl = form.querySelector("[data-name-error]");
        const control = form.querySelector(".form-control");

        const showError = (message) => {
          if (errorEl) {
            errorEl.textContent = message;
            errorEl.hidden = false;
            errorEl.classList.add("is-visible");
          }
          control?.classList.add("is-error");
        };

        const clearError = () => {
          if (errorEl) {
            errorEl.hidden = true;
            errorEl.classList.remove("is-visible");
            errorEl.textContent = "";
          }
          control?.classList.remove("is-error");
        };

        form.addEventListener("submit", (e) => {
          const value = (input?.value || "").trim();
          if (!value) {
            e.preventDefault();
            showError("يرجى إدخال اسمك للمتابعة.");
            input?.focus();
          } else {
            clearError();
          }
        });

        input?.addEventListener("input", () => clearError());
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
