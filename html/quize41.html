<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 41</title>
    <style>
      .commitment-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        align-items: center;
        position: relative;
      }

      .commitment-header {
        text-align: center;
        max-width: 640px;
      }

      .commitment-header .question-title {
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 600;
        color: #17271f;
        margin: 0;
      }

      .commitment-header .question-subtitle {
        color: #6b7280;
        margin-top: 8px;
        font-size: 1rem;
      }

      .commitment-scale {
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
      }

      .commitment-icons {
        display: flex;
        gap: 10px;
        justify-content: space-between;
        flex-wrap: nowrap;
        width: min(720px, 100%);
        transform: scale(1.1);
        transform-origin: center;
      }

      .commitment-icon {
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .commitment-icon:hover {
        transform: translateY(-3px);
      }

      .commitment-icon img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        opacity: 0.35;
        transition: opacity 0.2s ease;
      }

      .commitment-icon.is-active img {
        opacity: 1;
      }

      .commitment-numbers {
        width: min(720px, 100%);
        display: flex;
        justify-content: space-between;
        gap: 8px;
        transform: scale(1.1);
        transform-origin: center;
      }

      .commitment-number {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: 2px solid #d5e2db;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 1rem;
        color: #17271f;
        background: #fff;
        cursor: pointer;
        transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
      }

      .commitment-number.is-active {
        border-color: #294e3e;
        background: #294e3e;
        color: #fff;
      }

      .commitment-actions {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .commitment-actions .button {
        width: min(320px, 100%);
      }

      .commitment-figure {
        position: absolute;
        top: -60px;
        inset-inline-start: 0;
        display: flex;
        justify-content: flex-start;
        width: 120px;
      }

      .commitment-figure img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      @media (max-width: 768px) {
        .commitment-scale {
          gap: 16px;
          width: 100%;
        }

        .commitment-icons,
        .commitment-numbers {
          width: 100%;
          gap: 4px;
          transform: scale(1);
        }

        .commitment-icon img {
          width: 34px;
          height: 34px;
        }

        .commitment-number {
          width: 44px;
          height: 44px;
          font-size: 0.9rem;
        }

        .commitment-figure {
          position: static;
          width: 140px;
          order: 3;
          margin-top: 12px;
          transform: none;
          align-self: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize40.html" aria-label="عودة إلى السؤال السابق" data-commitment-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">41/47</div>
            <div class="text-wrapper-2">الاهداف الطموحات</div>
            <div class="text-wrapper">87%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="87"
              style="--progress-percent: 87%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 commitment-question" data-commitment-widget>
          <div class="commitment-figure">
            <img data-commitment-figure alt="مشارك في الاختبار" />
          </div>
          <div class="commitment-header">
            <p class="question-title">ما مستوى التزامك من 1 إلى 10؟</p>
            <p class="question-subtitle">اختر الدرجة التي تمثل مدى استعدادك للالتزام ببرنامجنا.</p>
          </div>
          <div class="commitment-scale">
            <div class="commitment-icons" data-commitment-icons>
              <!-- Icons will be injected via JS -->
            </div>
            <div class="commitment-numbers" data-commitment-numbers>
              <!-- Numbers injected via JS -->
            </div>
          </div>
          <div class="commitment-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize42.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-commitment-next
              data-commitment-gender-link
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-commitment-widget]");
        if (!widget) return;

        const iconsContainer = widget.querySelector("[data-commitment-icons]");
        const numbersContainer = widget.querySelector("[data-commitment-numbers]");
        const nextLink = widget.querySelector("[data-commitment-next]");
        const genderLinks = document.querySelectorAll("[data-commitment-gender-link]");
        const figureImg = widget.querySelector("[data-commitment-figure]");

        const filledIconMale = "../assets/images/muscle_filled.svg";
        const emptyIconMale = "../assets/images/muscle_empty.svg";
        const filledIconFemale = "../assets/images/muscle_filled.svg";
        const emptyIconFemale = "../assets/images/muscle_empty.svg";
        const figureMale = "../assets/images/men1.svg";
        const figureFemale = "../assets/images/women1.svg";

        const selected = { value: null };

        const renderScale = () => {
          iconsContainer.innerHTML = "";
          numbersContainer.innerHTML = "";

          const isFemale = (new URLSearchParams(window.location.search).get("gender") || "").toLowerCase() === "female";
          const emptyIconDefault = isFemale ? emptyIconFemale : emptyIconMale;
          if (figureImg) {
            figureImg.src = isFemale ? figureFemale : figureMale;
            figureImg.alt = isFemale ? "مشاركة" : "مشارك";
          }
          for (let i = 1; i <= 10; i++) {
            const iconButton = document.createElement("button");
            iconButton.type = "button";
            iconButton.className = "commitment-icon";
            iconButton.dataset.commitmentValue = i;
            iconButton.innerHTML = `<img src="${emptyIconDefault}" alt="${i}" />`;
            iconsContainer.appendChild(iconButton);

            const numberButton = document.createElement("button");
            numberButton.type = "button";
            numberButton.className = "commitment-number";
            numberButton.dataset.commitmentValue = i;
            numberButton.textContent = i;
            numbersContainer.appendChild(numberButton);
          }
        };

        const updateScaleState = () => {
          const isFemale = (new URLSearchParams(window.location.search).get("gender") || "").toLowerCase() === "female";
          const filledIcon = isFemale ? filledIconFemale : filledIconMale;
          const emptyIcon = isFemale ? emptyIconFemale : emptyIconMale;
          const value = Number(selected.value);
          iconsContainer.querySelectorAll(".commitment-icon").forEach((icon) => {
            const iconValue = Number(icon.dataset.commitmentValue);
            icon.innerHTML = `<img src="${value && iconValue <= value ? filledIcon : emptyIcon}" alt="${iconValue}" />`;
            icon.classList.toggle("is-active", value && iconValue <= value);
          });
          numbersContainer.querySelectorAll(".commitment-number").forEach((number) => {
            const numberValue = Number(number.dataset.commitmentValue);
            number.classList.toggle("is-active", value && numberValue <= value);
          });
          widget.dataset.commitmentValue = value || "";
        };

        const handleSelection = (value) => {
          selected.value = value;
          updateScaleState();
        };

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const isFemale = (new URLSearchParams(window.location.search).get("gender") || "").toLowerCase() === "female";
          const url = new URL(href, window.location.href);
          if (isFemale) {
            url.searchParams.set("gender", "female");
          } else {
            url.searchParams.delete("gender");
          }
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };

        const applyInteractions = () => {
          const buttons = widget.querySelectorAll("[data-commitment-value]");
          buttons.forEach((btn) => {
            btn.addEventListener("click", () => handleSelection(Number(btn.dataset.commitmentValue)));
          });

          nextLink?.addEventListener("click", (event) => {
            if (!selected.value) {
              event.preventDefault();
              handleSelection(1);
            }
          });

          genderLinks.forEach(applyGenderToLink);
        };

        renderScale();
        applyInteractions();
        updateScaleState();

      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
