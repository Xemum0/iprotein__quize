<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 30</title>
    <style>
      .activity-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .activity-header {
        text-align: center;
        max-width: 640px;
        margin: 0 auto;
      }

      .activity-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .activity-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }

      .activity-option {
        width: 100%;
        border: 2px solid #d5e2db;
        border-radius: 18px;
        background: #fff;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        position: relative;
      }

      .activity-option:focus-visible {
        outline: 3px solid #7cc5a7;
        outline-offset: 3px;
      }

      .activity-option .option-icon {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #eef6f3;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .activity-option .option-icon img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .activity-option .option-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex: 1;
      }

      .activity-option .option-label {
        font-size: 1.15rem;
        font-weight: 700;
        color: #1f2933;
      }

      .activity-option .option-checkbox {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 2px solid #294e3e;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .activity-option .option-checkbox::after {
        content: "";
        width: 12px;
        height: 7px;
        border-left: 2px solid transparent;
        border-bottom: 2px solid transparent;
        transform: rotate(-45deg);
        transition: border-color 0.25s ease;
      }

      .activity-option.is-active {
        border-color: #294e3e;
        background: #f3f8f6;
        box-shadow: 0 12px 30px rgba(39, 76, 62, 0.1);
      }

      .activity-option.is-active .option-checkbox {
        background: #294e3e;
        border-color: #294e3e;
      }

      .activity-option.is-active .option-checkbox::after {
        border-color: #fff;
      }

      .activity-actions {
        display: flex;
        justify-content: center;
        margin-top: 8px;
      }

      .activity-actions .button {
        width: min(320px, 100%);
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize30.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">30/47</div>
            <div class="text-wrapper-2">عادات التمرين</div>
            <div class="text-wrapper">64%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="64"
              style="--progress-percent: 64%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 activity-question" data-activity-widget>
          <div class="activity-header">
            <p class="text-wrapper-3">كم مدة حصّتك التدريبية عادة؟</p>
            <p class="activity-description">
              شاركنا متوسط مدة التمرين لنوزع الشدة والمحتوى بشكل يناسب وقتك.
            </p>
          </div>
          <div class="activity-options">
            <button class="activity-option" type="button" data-activity-option="lt30" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/question25/clock.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">أقل من 30 دقيقة</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="activity-option" type="button" data-activity-option="30to45" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/question25/clock.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">من 30 إلى 45 دقيقة</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="activity-option" type="button" data-activity-option="45to60" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/question25/clock.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">من 45 دقيقة إلى ساعة</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="activity-option" type="button" data-activity-option="gt60" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/question25/clock.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">أكثر من ساعة</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
          </div>
          <div class="activity-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize32.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-activity-next
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-activity-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-activity-option]"));
        const nextButton = widget.querySelector("[data-activity-next]");

        const selected = new Set();

        const updateDataset = () => {
          widget.dataset.selectedDurations = Array.from(selected).join(",");
        };

        const toggleOption = (option) => {
          if (!option) return;
          const key = option.dataset.activityOption;
          if (selected.has(key)) {
            selected.delete(key);
            option.classList.remove("is-active");
            option.setAttribute("aria-pressed", "false");
          } else {
            selected.add(key);
            option.classList.add("is-active");
            option.setAttribute("aria-pressed", "true");
          }
          updateDataset();
        };

        options.forEach((option) => {
          option.addEventListener("click", () => toggleOption(option));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selected.size) {
            event.preventDefault();
            const first = options[0];
            if (first) toggleOption(first);
          }
        });
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
