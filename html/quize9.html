<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 8</title>
    <style>
      .lab-check-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .lab-check-header {
        text-align: center;
      }

      .lab-check-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .lab-check-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        align-items: center;
      }

      .lab-check-option {
        width: min(26rem, 100%);
        min-height: 92px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: #fff;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 28px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        gap: 16px;
      }

      .lab-check-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .lab-option-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .lab-option-label {
        direction: rtl;
      }

      .lab-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        padding: 8px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease;
      }

      .lab-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .lab-option-spacer {
        flex: 1;
      }

      .lab-option-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .lab-option-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .lab-check-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .lab-check-option.is-active .lab-icon {
        background: #deede7;
        box-shadow: inset 0 0 0 1px #294e3e0f;
      }

      .lab-check-option.is-active .lab-option-checkbox {
        background: #294e3e;
      }

      .lab-check-option.is-active .lab-option-tick {
        opacity: 1;
        border-color: #fff;
      }

      .lab-check-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .lab-check-actions .button {
        width: min(320px, 100%);
      }

      .lab-check-actions .btn-primary-btn-lg {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize8.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">8/47</div>
            <div class="text-wrapper-2">الحالة الهرمونية والصحية</div>
            <div class="text-wrapper">17%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="17"
              style="--progress-percent: 17%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 lab-check-question" data-labcheck-widget>
          <div class="lab-check-header">
            <p class="text-wrapper-3" data-labcheck-title>هل قمت بتحليل هرموني أو عام في آخر 6 أشهر؟</p>
            <p class="lab-check-description" data-labcheck-description>
              معرفة آخر تحاليلك تساعدنا في تخصيص خطتك الغذائية بشكل أدق.
            </p>
          </div>
          <div class="lab-check-options">
            <button class="lab-check-option" type="button" data-analysis-option="yes" aria-pressed="false">
              <div class="lab-option-right">
                <div class="lab-icon" aria-hidden="true">
                  <img src="../assets/images/right.svg" alt="" />
                </div>
                <span class="lab-option-label">نعم</span>
              </div>
              <div class="lab-option-spacer" aria-hidden="true"></div>
              <div class="lab-option-checkbox" aria-hidden="true">
                <div class="lab-option-tick"></div>
              </div>
            </button>
            <button class="lab-check-option" type="button" data-analysis-option="no" aria-pressed="false">
              <div class="lab-option-right">
                <div class="lab-icon" aria-hidden="true">
                  <img src="../assets/images/false.svg" alt="" />
                </div>
                <span class="lab-option-label">لا</span>
              </div>
              <div class="lab-option-spacer" aria-hidden="true"></div>
              <div class="lab-option-checkbox" aria-hidden="true">
                <div class="lab-option-tick"></div>
              </div>
            </button>
          </div>
          <div class="lab-check-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize10.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-labcheck-next
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-labcheck-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-analysis-option]");
        const titleEl = widget.querySelector("[data-labcheck-title]");
        const descriptionEl = widget.querySelector("[data-labcheck-description]");
        const nextButton = widget.querySelector("[data-labcheck-next]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "هل قمت بتحليل هرموني أو عام في آخر 6 أشهر؟",
            description: "معرفة آخر تحاليلك تساعدنا في تخصيص خطتك الغذائية بشكل أدق.",
          },
          female: {
            title: "هل قمتِ بتحليل هرموني أو عام في آخر 6 أشهر؟",
            description: "إخبارنا بآخر تحاليلك يساعدنا في تصميم خطة غذائية تناسبك أكثر.",
          },
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (!currentCopy) return;
          if (titleEl) titleEl.textContent = currentCopy.title;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) return;
          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.selectedAnalysis = "";
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });
          selectedOption = button;
          widget.dataset.selectedAnalysis = button.dataset.analysisOption || "";
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0] || null);
          }
        });

        applyCopy();
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
