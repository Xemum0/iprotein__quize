<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 37</title>
    <style>
      .injury-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        align-items: center;
      }

      .injury-header {
        max-width: 640px;
        text-align: center;
      }

      .injury-header .question-title {
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 600;
        color: #17271f;
        margin: 0;
      }

      .injury-header .question-subtitle {
        color: #6b7280;
        margin-top: 8px;
        font-size: 1rem;
      }

      .injury-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 24px;
        justify-items: center;
      }

      .injury-card {
        width: 240px;
        height: 260px;
        border-radius: 16px;
        background: #eef6f3;
        border: 2px solid transparent;
        padding: 16px 20px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        position: relative;
        cursor: pointer;
        overflow: hidden;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .injury-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 30px rgba(23, 39, 31, 0.12);
      }

      .injury-card.is-active {
        border-color: #294e3e;
        box-shadow: 0 14px 30px rgba(23, 39, 31, 0.16);
      }

      .injury-card img {
        position: absolute;
        top: 60px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 40px);
        height: 180px;
        object-fit: contain;
      }

      .injury-card-label {
        width: 100%;
        background: #fff;
        border-radius: 8px;
        border: 1px solid #7cc5a7;
        padding: 10px 16px;
        text-align: center;
        font-size: 1rem;
        font-weight: 600;
        color: #294e3e;
        position: relative;
        z-index: 1;
      }

      .injury-other-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .injury-other-field {
        width: clamp(320px, 50%, 520px);
      }

      .injury-other-field .input-outlined {
        width: 100%;
      }

      .injury-other-field .form-control {
        border: 1px solid #d5e2db;
        border-radius: 18px;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }

      .injury-other-field .text-field {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px;
        position: relative;
      }

      .injury-other-field .form-label {
        position: absolute;
        top: -12px;
        inset-inline-start: 20px;
        padding: 0 10px;
        background: #fff;
        border-radius: 10px;
        font-weight: 600;
        color: #0a3524;
      }

      .injury-other-field .input-text-2 {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-size: 1rem;
        font-family: "IBM Plex Sans Arabic", sans-serif;
        color: #0a3524;
        text-align: right;
        direction: rtl;
      }

      .injury-actions {
        display: flex;
        justify-content: center;
        width: 100%;
      }

      .injury-actions .button {
        width: min(320px, 100%);
      }

      @media (max-width: 768px) {
        .injury-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }

        .injury-card {
          width: 100%;
          max-width: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize36.html" aria-label="عودة إلى السؤال السابق" data-injury-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">37/47</div>
            <div class="text-wrapper-2">عادات التمرين</div>
            <div class="text-wrapper">79%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="79"
              style="--progress-percent: 79%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 injury-question" data-injury-widget>
          <div class="injury-header">
            <p class="question-title" data-injury-question>ما هي المناطق الضعيفة في جسمك؟</p>
            <p class="question-subtitle" data-injury-description>
              حددي المناطق التي ترغبين في تقويتها لنركز على تمارين تستهدف احتياجاتك.
            </p>
          </div>
          <div class="injury-grid">
            <button class="injury-card" type="button" data-injury-option="shoulder" aria-pressed="false" data-injury-image>
              <span class="injury-card-label">الصدر</span>
            </button>
            <button class="injury-card" type="button" data-injury-option="knee" aria-pressed="false" data-injury-image>
              <span class="injury-card-label">الساقان</span>
            </button>
            <button class="injury-card" type="button" data-injury-option="back" aria-pressed="false" data-injury-image>
              <span class="injury-card-label">الأرداف</span>
            </button>
            <button class="injury-card" type="button" data-injury-option="none" aria-pressed="false" data-injury-image>
              <span class="injury-card-label">البطن</span>
            </button>
          </div>
          <div class="injury-other-wrapper">
            <div class="injury-other-field" data-injury-other-field>
              <div class="input-outlined">
                <div class="form-control">
                  <div class="text-field">
                    <div class="form-label">أخرى (يرجى التوضيح)</div>
                    <div class="input-text">
                      <input
                        class="input-text-2"
                        type="text"
                        placeholder="اكتب نوع الإصابة إن وجد"
                        data-injury-other-input
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="injury-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize38.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-injury-next
              data-injury-gender-link
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-injury-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-injury-option]"));
        const nextButton = widget.querySelector("[data-injury-next]");
        const questionEl = widget.querySelector("[data-injury-question]");
        const descriptionEl = widget.querySelector("[data-injury-description]");
        const otherField = widget.querySelector("[data-injury-other-field]");
        const otherInput = widget.querySelector("[data-injury-other-input]");
        const otherLabel = otherField?.querySelector(".form-label");
        const genderLinks = document.querySelectorAll("[data-injury-gender-link]");

        const params = new URLSearchParams(window.location.search);
        const genderParam = (params.get("gender") || "").toLowerCase();
        const gender = genderParam === "female" ? "female" : "male";

        const copy = {
          female: {
            question: "ما هي المناطق الضعيفة في جسمكِ؟",
            description: "اختاري المناطق التي ترغبين في تقويتها حتى نركز التمارين عليها."
          },
          male: {
            question: "ما هي المناطق الضعيفة في جسمك؟",
            description: "اختر المناطق التي ترغب في تقويتها حتى نركز التمارين عليها."
          }
        };

        const bodyAreas = {
          female: [
            { key: "chest", label: "الصدر", img: "../assets/images/question36/women_chest.svg" },
            { key: "legs", label: "الساقان", img: "../assets/images/question36/women_legs.svg" },
            { key: "butt", label: "الأرداف", img: "../assets/images/question36/women_butt.svg" },
            { key: "abs", label: "البطن", img: "../assets/images/question36/women_abs.svg" }
          ],
          male: [
            { key: "legs", label: "الساقان", img: "../assets/images/question36/men_legs.svg" },
            { key: "arms", label: "الذراعان", img: "../assets/images/question36/men_arms.svg" },
            { key: "chest", label: "الصدر", img: "../assets/images/question36/men_chest.svg" },
            { key: "abs", label: "البطن", img: "../assets/images/question36/men_abs.svg" }
          ]
        };

        const otherCopy = {
          female: {
            label: "أخرى (يرجى التوضيح)",
            placeholder: "اذكري المنطقة الضعيفة"
          },
          male: {
            label: "أخري (يرجى التوضيح)",
            placeholder: "اذكر المنطقة الضعيفة"
          }
        };

        const applyGenderCopy = () => {
          const currentCopy = copy[gender];
          const areas = bodyAreas[gender] || [];
          if (questionEl) questionEl.textContent = currentCopy.question;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
          options.forEach((option, index) => {
            const area = areas[index];
            if (!area) return;
            option.dataset.injuryOption = area.key;
            let img = option.querySelector("img");
            if (!img) {
              img = document.createElement("img");
              option.insertBefore(img, option.firstChild);
            }
            img.src = area.img;
            img.alt = area.label;
            const label = option.querySelector(".injury-card-label");
            if (label) label.textContent = area.label;
          });
          const otherCfg = otherCopy[gender];
          if (otherLabel && otherCfg) otherLabel.textContent = otherCfg.label;
          if (otherInput && otherCfg) otherInput.placeholder = otherCfg.placeholder;
        };

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const url = new URL(href, window.location.href);
          if (gender === "female") {
            url.searchParams.set("gender", "female");
          } else {
            url.searchParams.delete("gender");
          }
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };

        const selected = new Set();

        const updateDataset = () => {
          widget.dataset.selectedInjuries = Array.from(selected).join(",");
        };

        const toggleOption = (option) => {
          if (!option) return;
          const key = option.dataset.injuryOption;
          if (selected.has(key)) {
            selected.delete(key);
            option.classList.remove("is-active");
            option.setAttribute("aria-pressed", "false");
          } else {
            selected.add(key);
            option.classList.add("is-active");
            option.setAttribute("aria-pressed", "true");
          }
          updateDataset();
        };

        options.forEach((option) => {
          option.addEventListener("click", () => toggleOption(option));
        });

        otherInput?.addEventListener("input", () => {
          const value = otherInput.value.trim();
          if (value) {
            selected.add("other");
            otherField?.classList.add("is-active");
          } else {
            selected.delete("other");
            otherField?.classList.remove("is-active");
          }
          updateDataset();
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selected.size) {
            event.preventDefault();
            const first = options[0];
            if (first) toggleOption(first);
          }
        });

        applyGenderCopy();
        genderLinks.forEach(applyGenderToLink);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
