<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../assets/css/quiz.css" />
  <title>iProtein Quiz - Question 44</title>

  <style>
    .meal-style-question {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .meal-style-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
    }

    @media (min-width: 900px) {
      .meal-style-layout {
        flex-direction: row;
        align-items: stretch;
      }
    }

    .meal-style-card {
      flex: 1 1 50%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      border-radius: 24px;
      padding: clamp(20px, 3vw, 32px);
    }

    .meal-style-header {
      text-align: right;
    }

    .meal-style-description {
      color: #6b7280;
      font-size: 1rem;
      margin-top: 8px;
    }

    .meal-style-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .meal-style-option {
      width: 100%;
      min-height: 92px;
      border: 2px solid #294e3e;
      border-radius: 12px;
      background: transparent;
      color: #294e3e;
      display: flex;
      align-items: center;
      padding: 0 28px;
      cursor: pointer;
      font-size: 20px;
      font-weight: 600;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      gap: 16px;
    }

    .meal-style-option:focus-visible {
      outline: 3px solid #7cc5a7;
    }

    .meal-style-option .option-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .meal-style-option .option-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .meal-style-option .option-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .meal-style-option .option-spacer {
      flex: 1;
    }

    .meal-style-option .option-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid #294e3e;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .meal-style-option .option-tick {
      width: 12px;
      height: 7px;
      border-left: 2px solid #294e3e;
      border-bottom: 2px solid #294e3e;
      transform: rotate(-45deg);
      opacity: 0;
      transition: opacity 0.25s ease, border-color 0.25s ease;
    }

    .meal-style-option.is-active {
      background: #bcdcce;
      border-color: #294e3e;
    }

    .meal-style-option.is-active .option-icon {
      background: #deede7;
    }

    .meal-style-option.is-active .option-checkbox {
      background: #294e3e;
      border-color: #294e3e;
    }

    .meal-style-option.is-active .option-tick {
      opacity: 1;
      border-color: #fff;
    }

    .meal-style-figure {
      flex: 1 1 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 3vw, 24px);
    }

    .meal-style-figure img {
      width: min(480px, 100%);
      height: auto;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="AI-coach-quiz-2 quiz-placeholder-screen">
    <header class="header">
      <div class="frame">
        <div class="remix-icons-line-wrapper">
          <a class="icon-button" href="./quize44.html" aria-label="عودة إلى السؤال السابق" data-meal-style-gender-link>
            <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
          </a>
        </div>

        <div class="logo-wrapper">
          <div class="logo">
            <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
          </div>
        </div>

        <div class="remix-icons-line-wrapper">
          <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
        </div>
      </div>
    </header>

    <div class="frame-2">
      <div class="frame-3">
        <div class="frame-4">
          <div class="text-wrapper">44/47</div>
          <div class="text-wrapper-2">الاهداف الطموحات</div>
          <div class="text-wrapper">93%</div>
        </div>

        <div class="progress-section">
          <div
            class="progress-bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="93"
            style="--progress-percent: 93%; --total-steps: 7"
          >
            <div class="progress-line">
              <span class="progress-line-fill" aria-hidden="true"></span>
            </div>

            <ol class="progress-step-list" aria-label="مراحل الاختبار">
              <li class="progress-step completed"><span class="progress-node"></span></li>
              <li class="progress-step completed"><span class="progress-node"></span></li>
              <li class="progress-step completed"><span class="progress-node"></span></li>
              <li class="progress-step completed"><span class="progress-node"></span></li>
              <li class="progress-step completed"><span class="progress-node"></span></li>
              <li class="progress-step completed"><span class="progress-node"></span></li>
              <li class="progress-step"><span class="progress-node"></span></li>
            </ol>
          </div>
        </div>
      </div>

      <div class="frame-6 meal-style-question" data-meal-style-widget>
        <div class="meal-style-layout">
          <div class="meal-style-card">
            <div class="meal-style-header">
              <p class="text-wrapper-3" data-meal-style-title>كيف تفضل وجباتك؟</p>
              <p class="meal-style-description" data-meal-style-description>
                أخبرنا بالطريقة التي تفضل أن تكون عليها وجباتك لنراعيها عند تصميم الخطة الغذائية.
              </p>
            </div>

            <div class="meal-style-options">
              <button class="meal-style-option" type="button" data-meal-style-option="simple" aria-pressed="false">
                <div class="option-right">
                  <div class="option-icon">
                    <img src="../assets/images/question44/khafifa.svg" alt="وجبات بسيطة وسريعة" />
                  </div>
                  <span class="option-label">بسيطة وسريعة</span>
                </div>
                <div class="option-spacer"></div>
                <div class="option-checkbox"><div class="option-tick"></div></div>
              </button>

              <button class="meal-style-option" type="button" data-meal-style-option="varied" aria-pressed="false">
                <div class="option-right">
                  <div class="option-icon">
                    <img src="../assets/images/question44/motanawi3a.svg" alt="وجبات متنوعة" />
                  </div>
                  <span class="option-label">متنوعة</span>
                </div>
                <div class="option-spacer"></div>
                <div class="option-checkbox"><div class="option-tick"></div></div>
              </button>

              <button class="meal-style-option" type="button" data-meal-style-option="no-preference" aria-pressed="false">
                <div class="option-right">
                  <div class="option-icon">
                    <img src="../assets/images/question44/donotcar.svg" alt="لا يهم" />
                  </div>
                  <span class="option-label">لا يهم</span>
                </div>
                <div class="option-spacer"></div>
                <div class="option-checkbox"><div class="option-tick"></div></div>
              </button>
            </div>

            <div class="intensity-actions">
              <a
                class="button"
                data-animate="pulse"
                href="./quize46.html"
                aria-label="الانتقال إلى السؤال التالي"
                data-meal-style-next
                data-meal-style-gender-link
              >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                  <div class="button-2">التالي</div>
                </div>
              </a>
            </div>
          </div>

          <div class="meal-style-figure">
            <img src="../assets/images/main.svg" alt="شخص يستعرض خطة وجبات" data-meal-style-figure />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const widget = document.querySelector("[data-meal-style-widget]");
      if (!widget) return;

      const options = Array.from(widget.querySelectorAll("[data-meal-style-option]"));
      const nextButton = widget.querySelector("[data-meal-style-next]");
      const titleEl = widget.querySelector("[data-meal-style-title]");
      const descriptionEl = widget.querySelector("[data-meal-style-description]");
      const figureImg = widget.querySelector("[data-meal-style-figure]");
      const genderLinks = document.querySelectorAll("[data-meal-style-gender-link]");

      const params = new URLSearchParams(window.location.search);
      const genderParam = (params.get("gender") || "").toLowerCase();
      const gender = genderParam === "female" ? "female" : "male";

      const copy = {
        male: {
          title: "كيف تفضل وجباتك؟",
          description: "أخبرنا بالطريقة التي تفضل أن تكون عليها وجباتك لنراعيها عند تصميم الخطة الغذائية.",
          figure: "../assets/images/main.svg",
          figureAlt: "شخص يستعرض خطة وجبات"
        },
        female: {
          title: "كيف تفضلين وجباتك؟",
          description: "أخبرينا بالطريقة التي تفضلين أن تكون عليها وجباتك لنراعيها عند تصميم الخطة الغذائية.",
          figure: "../assets/images/main.svg",
          figureAlt: "شخص يستعرض خطة وجبات"
        }
      };

      const applyGenderToLink = (link) => {
        if (!link) return;
        const href = link.getAttribute("href");
        if (!href) return;
        const url = new URL(href, window.location.href);
        if (gender === "female") {
          url.searchParams.set("gender", "female");
        } else {
          url.searchParams.delete("gender");
        }
        link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
      };

      const applyCopy = () => {
        const data = copy[gender];
        if (titleEl) titleEl.textContent = data.title;
        if (descriptionEl) descriptionEl.textContent = data.description;
        if (figureImg) {
          figureImg.src = data.figure;
          figureImg.alt = data.figureAlt;
        }
      };

      let activeOption = null;

      const updateDataset = () => {
        widget.dataset.selectedMealStyle = activeOption ? activeOption.dataset.mealStyleOption : "";
      };

      const setActiveOption = (option) => {
        if (activeOption === option) {
          option.classList.remove("is-active");
          option.setAttribute("aria-pressed", "false");
          activeOption = null;
          updateDataset();
          return;
        }

        if (activeOption) {
          activeOption.classList.remove("is-active");
          activeOption.setAttribute("aria-pressed", "false");
        }

        activeOption = option;
        activeOption.classList.add("is-active");
        activeOption.setAttribute("aria-pressed", "true");
        updateDataset();
      };

      options.forEach((option) => {
        option.addEventListener("click", () => setActiveOption(option));
      });

      nextButton?.addEventListener("click", (e) => {
        if (!activeOption) {
          e.preventDefault();
          setActiveOption(options[0]);
        }
      });

      applyCopy();
      genderLinks.forEach(applyGenderToLink);
    })();
  </script>

  <script src="../assets/js/quiz.js"></script>
</body>
</html>
