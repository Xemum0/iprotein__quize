<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 27</title>
    <style>
      .activity-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .activity-header {
        text-align: center;
        max-width: 640px;
        margin: 0 auto;
      }

      .activity-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .activity-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
      }

      .activity-option {
        width: 100%;
        border: 2px solid #d5e2db;
        border-radius: 18px;
        background: #fff;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        position: relative;
      }

      .activity-option:focus-visible {
        outline: 3px solid #7cc5a7;
        outline-offset: 3px;
      }

      .activity-option .option-icon {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #eef6f3;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .activity-option .option-icon img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .activity-option .option-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex: 1;
      }

      .activity-option .option-label {
        font-size: 1.15rem;
        font-weight: 700;
        color: #1f2933;
      }

      .activity-option .option-checkbox {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 2px solid #294e3e;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .activity-option .option-checkbox::after {
        content: "";
        width: 12px;
        height: 7px;
        border-left: 2px solid transparent;
        border-bottom: 2px solid transparent;
        transform: rotate(-45deg);
        transition: border-color 0.25s ease;
      }

      .activity-option.is-active {
        border-color: #294e3e;
        background: #f3f8f6;
        box-shadow: 0 12px 30px rgba(39, 76, 62, 0.1);
      }

      .activity-option.is-active .option-checkbox {
        background: #294e3e;
        border-color: #294e3e;
      }

      .activity-option.is-active .option-checkbox::after {
        border-color: #fff;
      }

      .activity-actions {
        display: flex;
        justify-content: center;
        margin-top: 8px;
      }

      .activity-actions .button {
        width: min(320px, 100%);
      }

      .activity-floating-figure {
        position: absolute;
        right: calc((100% - 100vw) / 2);
        top: 220px;
        width: clamp(140px, 22vw, 260px);
        pointer-events: none;
        z-index: 0;
      }

      .activity-floating-figure img {
        width: 100%;
        height: auto;
        display: block;
      }

      .frame-2 {
        position: relative;
      }

      @media (max-width: 768px) {
        .activity-options {
          max-width: 100%;
        }

        .activity-floating-figure {
          opacity: 0.2;
          top: 260px;
          right: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize27.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">27/47</div>
            <div class="text-wrapper-2">عادات التمرين</div>
            <div class="text-wrapper">57%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="57"
              style="--progress-percent: 57%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="activity-floating-figure" aria-hidden="true">
          <img src="../assets/images/question27/trainere.svg" alt="" data-activity-figure />
        </div>
        <div class="frame-6 activity-question" data-activity-widget>
          <div class="activity-header">
            <p class="text-wrapper-3" data-activity-title>منذ متى وأنت تمارسين الرياضة؟</p>
            <p class="activity-description" data-activity-description>
              أخبرينا بمدة ممارستكِ للرياضة لنحدد مستوى تجربتك وبرنامجك التدريبي.
            </p>
          </div>
          <div class="activity-options">
            <button class="activity-option" type="button" data-activity-option="none" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/false.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">لا أمارس الرياضة</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="activity-option" type="button" data-activity-option="lt3" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/question27/women.svg" alt="" data-activity-runner-icon />
              </div>
              <div class="option-content">
                <span class="option-label">منذ أقل من 3 أشهر</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="activity-option" type="button" data-activity-option="3to6" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/question27/women.svg" alt="" data-activity-mid-icon />
              </div>
              <div class="option-content">
                <span class="option-label">من 3 إلى 6 أشهر</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="activity-option" type="button" data-activity-option="6to12" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/question27/women.svg" alt="" data-activity-long-icon />
              </div>
              <div class="option-content">
                <span class="option-label">من 6 أشهر إلى سنة</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="activity-option" type="button" data-activity-option="gt12" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/question27/women.svg" alt="" data-activity-pro-icon />
              </div>
              <div class="option-content">
                <span class="option-label">أكثر من سنة</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
          </div>
          <div class="activity-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize29.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-activity-next
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-activity-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-activity-option]"));
        const nextButton = widget.querySelector("[data-activity-next]");
        const titleEl = widget.querySelector("[data-activity-title]");
        const descriptionEl = widget.querySelector("[data-activity-description]");
        const figureImg = document.querySelector("[data-activity-figure]");
        const runnerIcon = widget.querySelector("[data-activity-runner-icon]");
        const midIcon = widget.querySelector("[data-activity-mid-icon]");
        const longIcon = widget.querySelector("[data-activity-long-icon]");
        const proIcon = widget.querySelector("[data-activity-pro-icon]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "منذ متى وأنت تمارس الرياضة؟",
            description: "أخبرنا بمدة ممارستك للرياضة لنحدد مستوى تجربتك وبرنامجك التدريبي.",
            figure: "../assets/images/question27/trainer.svg",
            figureAlt: "مدرب يتمرن",
            runnerIcon: "../assets/images/question27/men.svg",
            midIcon: "../assets/images/question27/men.svg",
            longIcon: "../assets/images/question27/men.svg",
            proIcon: "../assets/images/question27/men.svg",
          },
          female: {
            title: "منذ متى وأنت تمارسين الرياضة؟",
            description: "أخبرينا بمدة ممارستكِ للرياضة لنحدد مستوى تجربتك وبرنامجك التدريبي.",
            figure: "../assets/images/question27/trainere.svg",
            figureAlt: "مدربة تتمرن",
            runnerIcon: "../assets/images/question27/women.svg",
            midIcon: "../assets/images/question27/women.svg",
            longIcon: "../assets/images/question27/women.svg",
            proIcon: "../assets/images/question27/women.svg",
          },
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (!currentCopy) return;
          if (titleEl) titleEl.textContent = currentCopy.title;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
          if (figureImg) {
            figureImg.src = currentCopy.figure;
            figureImg.alt = currentCopy.figureAlt || "";
          }
          const runners = [runnerIcon, midIcon, longIcon, proIcon];
          const icons = [
            currentCopy.runnerIcon,
            currentCopy.midIcon,
            currentCopy.longIcon,
            currentCopy.proIcon,
          ];
          runners.forEach((img, index) => {
            if (img && icons[index]) {
              img.src = icons[index];
            }
          });
        };

        let activeOption = null;

        const updateDataset = () => {
          widget.dataset.selectedActivity = activeOption ? activeOption.dataset.activityOption : "";
        };

        const setActiveOption = (button) => {
          if (!button) return;
          if (activeOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            activeOption = null;
            updateDataset();
            return;
          }

          if (activeOption) {
            activeOption.classList.remove("is-active");
            activeOption.setAttribute("aria-pressed", "false");
          }

          activeOption = button;
          button.classList.add("is-active");
          button.setAttribute("aria-pressed", "true");
          updateDataset();
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!activeOption) {
            event.preventDefault();
            const first = options[0];
            if (first) setActiveOption(first);
          }
        });

        applyCopy();
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
