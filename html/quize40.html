<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 39</title>
    <style>
      .goal-timeline-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
        align-items: center;
      }

      .goal-timeline-header {
        text-align: center;
        max-width: 640px;
      }

      .goal-timeline-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .goal-timeline-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        max-width: 520px;
      }

      .goal-timeline-option {
        width: 100%;
        border: 2px solid #d5e2db;
        border-radius: 18px;
        background: #fff;
        padding: 18px 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        position: relative;
      }

      .goal-timeline-option:focus-visible {
        outline: 3px solid #7cc5a7;
        outline-offset: 3px;
      }

      .goal-timeline-option .option-icon {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: #eef6f3;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .goal-timeline-option .option-icon img {
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .goal-timeline-option .option-content {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex: 1;
      }

      .goal-timeline-option .option-label {
        font-size: 1.05rem;
        font-weight: 600;
        color: #1f2933;
      }

      .goal-timeline-option .option-checkbox {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 2px solid #294e3e;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .goal-timeline-option .option-checkbox::after {
        content: "";
        width: 12px;
        height: 7px;
        border-left: 2px solid transparent;
        border-bottom: 2px solid transparent;
        transform: rotate(-45deg);
        transition: border-color 0.25s ease;
      }

      .goal-timeline-option.is-active {
        border-color: #294e3e;
        background: #f3f8f6;
        box-shadow: 0 12px 30px rgba(39, 76, 62, 0.1);
      }

      .goal-timeline-option.is-active .option-checkbox {
        background: #294e3e;
        border-color: #294e3e;
      }

      .goal-timeline-option.is-active .option-checkbox::after {
        border-color: #fff;
      }

      .goal-timeline-actions {
        display: flex;
        justify-content: center;
      }

      .goal-timeline-actions .button {
        width: min(320px, 100%);
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize39.html" aria-label="عودة إلى السؤال السابق" data-goal-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">39/47</div>
            <div class="text-wrapper-2">الاهداف الطموحات</div>
            <div class="text-wrapper">83%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="83"
              style="--progress-percent: 83%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 goal-timeline-question" data-goal-timeline-widget>
          <div class="goal-timeline-header">
            <p class="text-wrapper-3" data-goal-question>خلال كم شهر تريدين تحقيق هدفك؟</p>
            <p class="goal-timeline-description" data-goal-description>
              اختاري أو اختر الإطار الزمني الذي يناسب خطتك لنحدد الشدة والتدرج بدقة.
            </p>
          </div>
          <div class="goal-timeline-options">
            <button class="goal-timeline-option" type="button" data-goal-option="1-month" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/calender.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">خلال شهر</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="goal-timeline-option" type="button" data-goal-option="3-months" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/calender.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">خلال 3 أشهر</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="goal-timeline-option" type="button" data-goal-option="6-months" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/calender.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">خلال 6 أشهر</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
            <button class="goal-timeline-option" type="button" data-goal-option="1-year" aria-pressed="false">
              <div class="option-icon">
                <img src="../assets/images/calender.svg" alt="" />
              </div>
              <div class="option-content">
                <span class="option-label">خلال سنة</span>
                <div class="option-checkbox" aria-hidden="true"></div>
              </div>
            </button>
          </div>
          <div class="goal-timeline-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize41.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-goal-next
              data-goal-gender-link
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-goal-timeline-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-goal-option]"));
        const nextButton = widget.querySelector("[data-goal-next]");
        const questionElement = widget.querySelector("[data-goal-question]");
        const descriptionElement = widget.querySelector("[data-goal-description]");
        const genderLinks = document.querySelectorAll("[data-goal-gender-link]");

        const params = new URLSearchParams(window.location.search);
        const genderParam = (params.get("gender") || "").toLowerCase();
        const gender = genderParam === "female" ? "female" : "male";

        const questionCopy = {
          female: "خلال كم شهر تريدين تحقيق هدفك؟",
          male: "خلال كم شهر تريد تحقيق هدفك؟"
        };
        const descriptionCopy = {
          female: "اختاري الإطار الزمني الذي يناسب خطتك لنحدد الشدة والتدرج بدقة.",
          male: "اختر الإطار الزمني الذي يناسب خطتك لنحدد الشدة والتدرج بدقة."
        };

        if (questionElement) {
          questionElement.textContent = questionCopy[gender];
        }
        if (descriptionElement) {
          descriptionElement.textContent = descriptionCopy[gender];
        }

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const url = new URL(href, window.location.href);
          url.searchParams.set("gender", gender);
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };

        const selected = new Set();

        const updateDataset = () => {
          widget.dataset.selectedGoalTimeline = Array.from(selected).join(",");
        };

        const toggleOption = (option) => {
          if (!option) return;
          const key = option.dataset.goalOption;
          if (selected.has(key)) {
            selected.delete(key);
            option.classList.remove("is-active");
            option.setAttribute("aria-pressed", "false");
          } else {
            selected.clear();
            widget.querySelectorAll(".goal-timeline-option.is-active").forEach((active) => {
              active.classList.remove("is-active");
              active.setAttribute("aria-pressed", "false");
            });
            selected.add(key);
            option.classList.add("is-active");
            option.setAttribute("aria-pressed", "true");
          }
          updateDataset();
        };

        options.forEach((option) => {
          option.addEventListener("click", () => toggleOption(option));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selected.size) {
            event.preventDefault();
            const first = options[0];
            if (first) toggleOption(first);
          }
        });

        genderLinks.forEach(applyGenderToLink);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
