<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 13</title>
    <style>
      .energy-status-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
      }

      .energy-status-header {
        text-align: center;
      }

      .energy-status-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .energy-status-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        align-items: center;
      }

      .energy-status-option {
        width: min(28rem, 100%);
        min-height: 96px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: #fff;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 32px;
        cursor: pointer;
        font-size: 18px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        flex-direction: row;
        gap: 16px;
      }

      .energy-status-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .energy-status-option .energy-right-pack {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-direction: row;
      }

      .energy-status-option .energy-label {
        direction: rtl;
        line-height: 1.3;
        text-align: right;
      }

      .energy-status-option .energy-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #f5faf8;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 6px;
      }

      .energy-status-option .energy-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .energy-status-option .energy-spacer {
        flex: 1;
      }

      .energy-status-option .energy-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .energy-status-option .energy-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .energy-status-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .energy-status-option.is-active .energy-checkbox {
        background: #294e3e;
      }

      .energy-status-option.is-active .energy-tick {
        opacity: 1;
        border-color: #fff;
      }

      .energy-status-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .energy-status-actions .button {
        width: min(320px, 100%);
      }

      .energy-status-actions .btn-primary-btn-lg {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize13.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">13/47</div>
            <div class="text-wrapper-2">الحالة الهرمونية والصحية</div>
            <div class="text-wrapper">28%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="28"
              style="--progress-percent: 28%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 energy-status-question" data-energystatus-widget>
          <div class="energy-status-header">
            <p class="text-wrapper-3" data-energystatus-title>كيف تصفين حالتكِ النفسية وطاقة جسمكِ العامة خلال اليوم؟</p>
            <p class="energy-status-description" data-energystatus-description>
              أخبرينا عن مستوى طاقتكِ وشعوركِ خلال اليوم لنساعدكِ بخطة تناسب احتياجاتكِ.
            </p>
          </div>
          <div class="energy-status-options">
            <button
              class="energy-status-option"
              type="button"
              data-energy-option="high"
              aria-pressed="false"
            >
              <div class="energy-right-pack">
                <div class="energy-icon">
                  <img src="../assets/images/question13/battery1.svg" alt="" />
                </div>
                <span class="energy-label">أشعر بالنشاط والحيوية طوال اليوم</span>
              </div>
              <div class="energy-spacer" aria-hidden="true"></div>
              <div class="energy-checkbox" aria-hidden="true">
                <div class="energy-tick"></div>
              </div>
            </button>
            <button
              class="energy-status-option"
              type="button"
              data-energy-option="fair"
              aria-pressed="false"
            >
              <div class="energy-right-pack">
                <div class="energy-icon">
                  <img src="../assets/images/question13/battery2.svg" alt="" />
                </div>
                <span class="energy-label">حالي جيدة بشكل عام مع بعض التعب أحياناً</span>
              </div>
              <div class="energy-spacer" aria-hidden="true"></div>
              <div class="energy-checkbox" aria-hidden="true">
                <div class="energy-tick"></div>
              </div>
            </button>
            <button
              class="energy-status-option"
              type="button"
              data-energy-option="low"
              aria-pressed="false"
            >
              <div class="energy-right-pack">
                <div class="energy-icon">
                  <img src="../assets/images/question13/battery3.svg" alt="" />
                </div>
                <span class="energy-label">أشعر بالإرهاق في أوقات كثيرة من اليوم</span>
              </div>
              <div class="energy-spacer" aria-hidden="true"></div>
              <div class="energy-checkbox" aria-hidden="true">
                <div class="energy-tick"></div>
              </div>
            </button>
            <button
              class="energy-status-option"
              type="button"
              data-energy-option="verylow"
              aria-pressed="false"
            >
              <div class="energy-right-pack">
                <div class="energy-icon">
                  <img src="../assets/images/question13/battery4.svg" alt="" />
                </div>
                <span class="energy-label">أعاني من التعب أو انخفاض الطاقة معظم اليوم</span>
              </div>
              <div class="energy-spacer" aria-hidden="true"></div>
              <div class="energy-checkbox" aria-hidden="true">
                <div class="energy-tick"></div>
              </div>
            </button>
          </div>
          <div class="energy-status-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize15.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-energystatus-next
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-energystatus-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-energy-option]");
        const titleEl = widget.querySelector("[data-energystatus-title]");
        const descriptionEl = widget.querySelector("[data-energystatus-description]");
        const nextButton = widget.querySelector("[data-energystatus-next]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "كيف تصف حالتك النفسية وطاقة جسمك العامة خلال اليوم؟",
            description: "أخبرنا عن مستوى طاقتك وشعورك خلال اليوم لنساعدك بخطة مناسبة.",
          },
          female: {
            title: "كيف تصفين حالتكِ النفسية وطاقة جسمكِ العامة خلال اليوم؟",
            description: "أخبرينا عن مستوى طاقتكِ وشعوركِ خلال اليوم لنساعدكِ بخطة مناسبة.",
          },
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (currentCopy) {
            if (titleEl) titleEl.textContent = currentCopy.title;
            if (descriptionEl) descriptionEl.textContent = currentCopy.description;
          }
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) return;
          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.selectedEnergy = "";
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });
          selectedOption = button;
          widget.dataset.selectedEnergy = button.dataset.energyOption || "";
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0] || null);
          }
        });

        applyCopy();
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
