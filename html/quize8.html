<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 7</title>
    <style>
      .weight-trend-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .weight-trend-floating-figure {
        position: fixed;
        right: 0;
        top: 0;
        width: clamp(220px, 28vw, 340px);
        pointer-events: none;
        z-index: 0;
      }

      .weight-trend-floating-figure img {
        width: 100%;
        height: auto;
        display: block;
      }

      .weight-trend-header {
        text-align: center;
      }

      .weight-trend-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .weight-trend-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
        align-items: center;
      }

      .weight-trend-option {
        width: min(26rem, 100%);
        height: 86px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: #fff;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 32px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        flex-direction: row;
        gap: 16px;
      }

      .weight-trend-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .weight-trend-option .trend-right-pack {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-direction: row;
      }

      .weight-trend-option .trend-label {
        direction: rtl;
        line-height: 1.1;
      }

      .weight-trend-option .trend-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        padding: 8px;
        background: #fff;
        transition: background 0.25s ease;
      }

      .weight-trend-option .trend-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .weight-trend-option .trend-spacer {
        flex: 1;
      }

      .weight-trend-option .trend-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .weight-trend-option .trend-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .weight-trend-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .weight-trend-option.is-active .trend-icon {
        background: #deede7;
      }

      .weight-trend-option.is-active .trend-checkbox {
        background: #294e3e;
      }

      .weight-trend-option.is-active .trend-tick {
        opacity: 1;
        border-color: #fff;
      }

      .weight-trend-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .weight-trend-actions .button {
        width: min(320px, 100%);
      }

      .weight-trend-actions .btn-primary-btn-lg {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize7.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">7/47</div>
            <div class="text-wrapper-2">المعلومات الشخصية</div>
            <div class="text-wrapper">15%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="15"
              style="--progress-percent: 15%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 weight-trend-question" data-weighttrend-widget>
          <div class="weight-trend-header">
            <p class="text-wrapper-3" data-weighttrend-title>كيف كان وزنك خلال الأشهر الثلاثة الماضية؟</p>
            <p class="weight-trend-description" data-weighttrend-description>
              ساعدنا على فهم تطور وزنك مؤخرًا لنهيئ خطة تناسب أهدافك بشكل أفضل.
            </p>
          </div>
          <div class="weight-trend-options">
            <button
              class="weight-trend-option"
              type="button"
              data-trend-option="stable"
              aria-pressed="false"
            >
              <div class="trend-right-pack">
                <div class="trend-icon">
                  <img src="../assets/images/spike.svg" alt="" />
                </div>
                <span class="trend-label">مستقر</span>
              </div>
              <div class="trend-spacer" aria-hidden="true"></div>
              <div class="trend-checkbox" aria-hidden="true">
                <div class="trend-tick"></div>
              </div>
            </button>
            <button
              class="weight-trend-option"
              type="button"
              data-trend-option="gaining"
              aria-pressed="false"
            >
              <div class="trend-right-pack">
                <div class="trend-icon">
                  <img src="../assets/images/up.svg" alt="" />
                </div>
                <span class="trend-label">يزداد</span>
              </div>
              <div class="trend-spacer" aria-hidden="true"></div>
              <div class="trend-checkbox" aria-hidden="true">
                <div class="trend-tick"></div>
              </div>
            </button>
            <button
              class="weight-trend-option"
              type="button"
              data-trend-option="losing"
              aria-pressed="false"
            >
              <div class="trend-right-pack">
                <div class="trend-icon">
                  <img src="../assets/images/down.svg" alt="" />
                </div>
                <span class="trend-label">ينقص</span>
              </div>
              <div class="trend-spacer" aria-hidden="true"></div>
              <div class="trend-checkbox" aria-hidden="true">
                <div class="trend-tick"></div>
              </div>
            </button>
          </div>
          <div class="weight-trend-actions">
            <a
              class="button"
              data-animate="pulse"
              href="./quize9.html"
              aria-label="الانتقال إلى السؤال التالي"
              data-weighttrend-next
            >
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <div class="weight-trend-floating-figure" aria-hidden="true">
      <img src="../assets/images/menjumb.svg" alt="" data-weighttrend-figure />
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-weighttrend-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-trend-option]");
        const titleEl = widget.querySelector("[data-weighttrend-title]");
        const descriptionEl = widget.querySelector("[data-weighttrend-description]");
        const nextButton = widget.querySelector("[data-weighttrend-next]");
        const figureImg = document.querySelector("[data-weighttrend-figure]");
        const figureWrapper = figureImg?.closest(".weight-trend-floating-figure");
        const referenceEl = widget.querySelector(".weight-trend-header");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "كيف كان وزنك خلال الأشهر الثلاثة الماضية؟",
            description: "ساعدنا على فهم تطوّر وزنك مؤخرًا لنضبط خطتك بالشكل الأمثل.",
          },
          female: {
            title: "كيف كان وزنكِ خلال الأشهر الثلاثة الماضية؟",
            description: "ساعدينا على فهم تطوّر وزنكِ مؤخرًا لنضبط خطتكِ بالشكل الأمثل.",
          },
        };

        const figureSources = {
          male: "../assets/images/menjumb.svg",
          female: "../assets/images/womenjumb.svg",
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (currentCopy) {
            if (titleEl) titleEl.textContent = currentCopy.title;
            if (descriptionEl) descriptionEl.textContent = currentCopy.description;
          }
          if (figureImg) {
            const src = figureSources[gender] || figureSources.male;
            figureImg.setAttribute("src", src);
          }
        };

        const syncFigurePosition = () => {
          if (!figureWrapper || !referenceEl) return;
          const rect = referenceEl.getBoundingClientRect();
          const top = Math.max(rect.top, 0);
          figureWrapper.style.top = `${top}px`;
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) return;
          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.selectedTrend = "";
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });
          selectedOption = button;
          widget.dataset.selectedTrend = button.dataset.trendOption || "";
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0] || null);
          }
        });

        window.addEventListener("resize", syncFigurePosition);
        window.addEventListener("scroll", syncFigurePosition, { passive: true });

        applyCopy();
        syncFigurePosition();
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
