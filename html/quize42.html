<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 41</title>
    <style>
      .barrier-question {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .barrier-layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
      }

      @media (min-width: 900px) {
        .barrier-layout {
          flex-direction: row;
          align-items: stretch;
        }
      }

      .barrier-card {
        flex: 1 1 50%;
        display: flex;
        flex-direction: column;
        gap: 24px;
        border-radius: 24px;
        padding: clamp(20px, 3vw, 32px);
      }

      .barrier-header {
        text-align: right;
      }

      .barrier-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .barrier-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }

      .barrier-option {
        width: 100%;
        min-height: 92px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: transparent;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 28px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        gap: 16px;
      }

      .barrier-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .barrier-option .option-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .barrier-option .option-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .barrier-option .option-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .barrier-option .option-spacer {
        flex: 1;
      }

      .barrier-option .option-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .barrier-option .option-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .barrier-option.is-active {
        border-color: #294e3e;
      }

      .barrier-option.is-active .option-checkbox {
        background: #294e3e;
        border-color: #294e3e;
      }

      .barrier-option.is-active .option-tick {
        opacity: 1;
        border-color: #fff;
      }

      .barrier-figure {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(12px, 3vw, 24px);
        border-radius: 24px;
      }

      .barrier-figure img {
        width: min(420px, 100%);
        height: auto;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize41.html" aria-label="عودة إلى السؤال السابق" data-barrier-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">41/47</div>
            <div class="text-wrapper-2">الاهداف الطموحات</div>
            <div class="text-wrapper">87%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="87"
              style="--progress-percent: 87%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 barrier-question" data-barrier-widget>
          <div class="barrier-layout">
            <div class="barrier-card">
              <div class="barrier-header">
                <p class="text-wrapper-3" data-barrier-title>ما أكبر عائق يمنعك من تحقيق هدفك؟</p>
                <p class="barrier-description" data-barrier-description>
                  أخبرنا بالعائق الأكبر الذي تواجهه حتى نهيئ لك خطة تناسب ظروفك وتدعم التزامك.
                </p>
              </div>
              <div class="barrier-options">
                <button class="barrier-option" type="button" data-barrier-option="time" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon">
                      <img src="../assets/images/question41/time.svg" alt="ضيق الوقت" />
                    </div>
                    <span class="option-label">ضيق الوقت</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>
                <button class="barrier-option" type="button" data-barrier-option="motivation" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon">
                      <img src="../assets/images/question41/nomotiv.svg" alt="قلة الحافز" />
                    </div>
                    <span class="option-label">قلة الحافز</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>
                <button class="barrier-option" type="button" data-barrier-option="nutrition" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon">
                      <img src="../assets/images/question41/eat.svg" alt="نظام غذائي غير منتظم" />
                    </div>
                    <span class="option-label">نظام غذائي غير منتظم</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>
                <button class="barrier-option" type="button" data-barrier-option="injury" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon">
                      <img src="../assets/images/question41/injury.svg" alt="الإصابات والتعب الجسدي" />
                    </div>
                    <span class="option-label">الإصابات والتعب الجسدي</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>
                <button class="barrier-option" type="button" data-barrier-option="support" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon">
                      <img src="../assets/images/question41/people.svg" alt="قلة الدعم أو المتابعة" />
                    </div>
                    <span class="option-label">قلة الدعم أو المتابعة</span>
                  </div>
                  <div class="option-spacer"></div>
                  <div class="option-checkbox"><div class="option-tick"></div></div>
                </button>
              </div>
              <div class="intensity-actions">
                <a
                  class="button"
                  data-animate="pulse"
                  href="./quize43.html"
                  aria-label="الانتقال إلى السؤال التالي"
                  data-barrier-next
                  data-barrier-gender-link
                >
                  <div class="btn-primary-btn-lg">
                    <div class="masked-icon">
                      <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                    </div>
                    <div class="button-2">التالي</div>
                  </div>
                </a>
              </div>
            </div>
            <div class="barrier-figure">
              <img src="../assets/images/question41/women.svg" alt="سيدة تتغلب على العوائق" data-barrier-figure />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-barrier-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-barrier-option]"));
        const nextButton = widget.querySelector("[data-barrier-next]");
        const titleEl = widget.querySelector("[data-barrier-title]");
        const descriptionEl = widget.querySelector("[data-barrier-description]");
        const figureImg = widget.querySelector("[data-barrier-figure]");
        const genderLinks = document.querySelectorAll("[data-barrier-gender-link]");

        const params = new URLSearchParams(window.location.search);
        const genderParam = (params.get("gender") || "").toLowerCase();
        const normalizedGender = genderParam === "male" ? "male" : "female";

        const copy = {
          female: {
            title: "ما أكبر عائق يمنعكِ من تحقيق هدفك؟",
            description: "أخبرينا بالعائق الأكبر الذي تواجهينه حتى نهيئ لك خطة تناسب ظروفك وتدعم التزامك.",
            figure: "../assets/images/question41/women.svg",
            figureAlt: "سيدة تتغلب على العوائق"
          },
          male: {
            title: "ما أكبر عائق يمنعك من تحقيق هدفك؟",
            description: "أخبرنا بالعائق الأكبر الذي تواجهه حتى نهيئ لك خطة تناسب ظروفك وتدعم التزامك.",
            figure: "../assets/images/question41/men.svg",
            figureAlt: "رجل يتغلب على العوائق"
          }
        };

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const url = new URL(href, window.location.href);
          url.searchParams.set("gender", normalizedGender);
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };

        const applyCopy = () => {
          const data = copy[normalizedGender];
          if (titleEl) titleEl.textContent = data.title;
          if (descriptionEl) descriptionEl.textContent = data.description;
          if (figureImg) {
            figureImg.src = data.figure;
            figureImg.alt = data.figureAlt;
          }
        };

        let activeOption = null;

        const updateDataset = () => {
          widget.dataset.selectedBarrier = activeOption ? activeOption.dataset.barrierOption : "";
        };

        const setActiveOption = (option) => {
          if (!option) return;
          if (activeOption === option) {
            option.classList.remove("is-active");
            option.setAttribute("aria-pressed", "false");
            activeOption = null;
            updateDataset();
            return;
          }

          if (activeOption) {
            activeOption.classList.remove("is-active");
            activeOption.setAttribute("aria-pressed", "false");
          }

          activeOption = option;
          activeOption.classList.add("is-active");
          activeOption.setAttribute("aria-pressed", "true");
          updateDataset();
        };

        options.forEach((option) => {
          option.addEventListener("click", () => setActiveOption(option));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!activeOption) {
            event.preventDefault();
            setActiveOption(options[0]);
          }
        });

        applyCopy();
        genderLinks.forEach(applyGenderToLink);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
