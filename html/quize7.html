<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 6</title>
    <style>
      .body-fat-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
      }

      .body-fat-header {
        text-align: center;
      }

      .body-fat-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .body-fat-content {
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 32px;
        flex-wrap: wrap;
      }

      .body-fat-figure-box {
        width: 220px;
        height: 420px;
        border: 3px solid #9bcab6;
        border-radius: 12px;
        background: #fff;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        padding: 16px 12px 12px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }

      .body-fat-figure-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: bottom;
        display: block;
      }

      .body-fat-figure-label {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        background: #294e3e;
        color: #fff;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        white-space: nowrap;
      }

      .body-fat-selector {
        width: min(560px, 100%);
        padding: 32px 24px;
        background: #deede7;
        border: 3px solid #deede7;
        border-radius: 20px;
        box-shadow: 0 0 10px rgba(222, 237, 231, 0.6);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        position: relative;
      }

      .body-fat-gradient {
        position: relative;
        width: 100%;
        height: 20px;
        border-radius: 12px;
        background: linear-gradient(90deg, #4caf4f 0%, #e6ed14 50%, #f43e44 100%);
        box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.1);
      }

      .body-fat-thumb {
        position: absolute;
        top: 50%;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 3px solid #294e3e;
        background: #fff;
        transform: translate(-50%, -50%);
        pointer-events: none;
        box-shadow: 0 2px 6px rgba(41, 78, 62, 0.25);
        transition: left 0.2s ease;
      }

      .body-fat-indicator {
        position: absolute;
        top: -50px;
        width: 96px;
        height: 38px;
        background: #294e3e;
        border-radius: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-weight: 700;
        font-size: 18px;
        transition: left 0.25s ease;
        pointer-events: none;
        transform: translateX(-50%);
      }

      .body-fat-indicator::after {
        content: "";
        position: absolute;
        bottom: -9px;
        left: 50%;
        transform: translateX(-50%);
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-top: 10px solid #294e3e;
      }

      .body-fat-slider {
        position: absolute;
        top: -8px;
        left: 0;
        width: 100%;
        height: 36px;
        display: flex;
        align-items: center;
        direction: ltr;
      }

      .body-fat-slider input[type="range"] {
        width: 100%;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        height: 6px;
        pointer-events: auto;
        direction: ltr;
      }

      .body-fat-slider input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        background: transparent;
        cursor: pointer;
      }

      .body-fat-slider input[type="range"]::-moz-range-thumb {
        width: 24px;
        height: 24px;
        background: transparent;
        border: none;
        cursor: pointer;
      }

      .body-fat-scale-labels {
        display: flex;
        justify-content: space-between;
        width: 100%;
        font-size: 16px;
        font-weight: 600;
        color: #294e3e;
        direction: ltr;
      }

      .body-fat-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
      }

      .button--full {
        width: min(320px, 100%);
      }

      .button--full .btn-primary-btn-lg {
        width: 100%;
      }

      @media (max-width: 768px) {
        .body-fat-figure-box {
          height: 360px;
        }

        .body-fat-selector {
          padding: 24px 16px;
        }

        .body-fat-indicator {
          width: 88px;
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize6.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">6/47</div>
            <div class="text-wrapper-2">المعلومات الشخصية</div>
            <div class="text-wrapper">13%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="13"
              style="--progress-percent: 13%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 body-fat-question" data-bodyfat-widget>
          <div class="body-fat-header">
            <p class="text-wrapper-3" data-bodyfat-title>ما هي نسبة الدهون في جسمك تقريبًا؟</p>
            <p class="body-fat-description" data-bodyfat-description>
              يساعدنا تحديد نسبة الدهون على تصميم برنامج يناسب حالتك البدنية الحالية ومستوى أهدافك.
            </p>
          </div>
          <div class="body-fat-content">
            <div class="body-fat-figure-box" data-bodyfat-figure-box>
              <div class="body-fat-figure-label" data-bodyfat-range>رياضي (5-12%)</div>
              <img
                src="../assets/images/question6/man1.svg"
                alt="متدرب يوضح نسبة الدهون الحالية"
                data-bodyfat-figure
              />
            </div>
            <div class="body-fat-selector">
              <div class="body-fat-gradient" data-bodyfat-bar>
                <div class="body-fat-thumb" aria-hidden="true" data-bodyfat-thumb></div>
                <div class="body-fat-indicator" data-bodyfat-indicator>20%</div>
                <div class="body-fat-slider">
                  <input
                    type="range"
                    min="5"
                    max="50"
                    step="1"
                    value="20"
                    aria-label="اختر نسبة الدهون في جسمك"
                    data-bodyfat-slider
                  />
                </div>
              </div>
              <div class="body-fat-scale-labels">
                <span>5%</span>
                <span>50%</span>
              </div>
            </div>
          </div>
          <div class="body-fat-actions">
            <a class="button button--full" data-animate="pulse" href="./quize8.html" aria-label="الانتقال إلى السؤال التالي" data-bodyfat-next>
              <div class="btn-primary-btn-lg">
                <div class="masked-icon">
                  <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                </div>
                <div class="button-2">التالي</div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-bodyfat-widget]");
        if (!widget) return;

        const slider = widget.querySelector("[data-bodyfat-slider]");
        const indicator = widget.querySelector("[data-bodyfat-indicator]");
        const bar = widget.querySelector("[data-bodyfat-bar]");
        const thumb = widget.querySelector("[data-bodyfat-thumb]");
        const figure = widget.querySelector("[data-bodyfat-figure]");
        const figureLabel = widget.querySelector("[data-bodyfat-range]");
        const titleEl = widget.querySelector("[data-bodyfat-title]");
        const descriptionEl = widget.querySelector("[data-bodyfat-description]");
        const nextLink = document.querySelector("[data-bodyfat-next]");

        if (!slider || !indicator || !bar || !figure || !figureLabel) {
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const genderParam = (params.get("gender") || "").toLowerCase();
        const gender = genderParam === "female" ? "female" : "male";

        const genderCopy = {
          male: {
            title: "ما هي نسبة الدهون في جسمك تقريبًا؟",
            description:
              "يساعدنا تحديد نسبة الدهون على تصميم برنامج يناسب حالتك البدنية الحالية ومستوى أهدافك.",
            figureAlt: "متدرب يوضح نسبة الدهون الحالية",
          },
          female: {
            title: "ما هي نسبة الدهون في جسمكِ تقريبًا؟",
            description:
              "يساعدنا تحديد نسبة الدهون على تصميم برنامج يناسب حالتكِ البدنية الحالية ومستوى أهدافك.",
            figureAlt: "متدربة توضّح نسبة الدهون الحالية",
          },
        };

        const ranges = [
          {
            min: 5,
            max: 12,
            label: "رياضي (5-12%)",
            male: "../assets/images/question6/man1.svg",
            female: "../assets/images/question6/female1.svg",
          },
          {
            min: 13,
            max: 20,
            label: "متوازن (13-20%)",
            male: "../assets/images/question6/man2.svg",
            female: "../assets/images/question6/female2.svg",
          },
          {
            min: 21,
            max: 30,
            label: "متوسط (21-30%)",
            male: "../assets/images/question6/man3.svg",
            female: "../assets/images/question6/female3.svg",
          },
          {
            min: 31,
            max: 50,
            label: "مرتفع (31-50%)",
            male: "../assets/images/question6/man4.svg",
            female: "../assets/images/question6/female4.svg",
          },
        ];

        const clampValue = (value) => {
          const min = Number(slider.min) || 5;
          const max = Number(slider.max) || 50;
          const numeric = Number(value);
          if (Number.isNaN(numeric)) return min;
          return Math.min(max, Math.max(min, numeric));
        };

        const resolveRange = (value) =>
          ranges.find((range) => value >= range.min && value <= range.max) ||
          ranges[ranges.length - 1];

        const alignHandles = () => {
          const min = Number(slider.min) || 5;
          const max = Number(slider.max) || 50;
          const value = Number(slider.value) || min;
          const barWidth = bar.clientWidth || 1;
          const ratio = (value - min) / (max - min);
          const clampedRatio = Math.min(Math.max(ratio, 0), 1);
          const position = clampedRatio * barWidth;
          indicator.style.left = `${position}px`;

          if (thumb) {
            thumb.style.left = `${position}px`;
          }
        };

        const updateUI = (rawValue) => {
          const value = clampValue(rawValue);
          slider.value = value;
          indicator.textContent = `${value}%`;
          alignHandles();

          const currentRange = resolveRange(value);
          figureLabel.textContent = currentRange.label;
          const nextSrc = currentRange[gender];
          figure.setAttribute("src", nextSrc);
          figure.setAttribute("alt", genderCopy[gender].figureAlt);

        };

        const applyGenderCopy = () => {
          const copy = genderCopy[gender];
          if (copy) {
            if (titleEl) titleEl.textContent = copy.title;
            if (descriptionEl) descriptionEl.textContent = copy.description;
            figure.setAttribute("alt", copy.figureAlt);
          }
        };

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const destination = new URL(href, window.location.href);
          destination.searchParams.set("gender", gender);
          const newHref = `${destination.pathname}${destination.search}${destination.hash}`;
          link.setAttribute("href", newHref);
        };

        slider.addEventListener("input", (event) => {
          updateUI(event.target.value);
        });

        window.addEventListener("resize", () => {
          alignHandles();
        });

        applyGenderCopy();
        applyGenderToLink(nextLink);
        updateUI(slider.value);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
