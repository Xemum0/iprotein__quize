<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
  </head>
  <body>
    <div class="AI-coach-quiz-2" data-question-number="1">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" />
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" />

            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">1/47</div>
            <div class="text-wrapper-2">المعلومات الشخصية</div>
            <div class="text-wrapper">2%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="2"
              style="--progress-percent: 2%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                <li class="progress-step completed">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
                <li class="progress-step">
                  <span class="progress-node" aria-hidden="true"></span>
                </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6">
          <div class="text-wrapper-3">ما هو جنسك؟</div>
          <div class="frame-7">
            <div class="component">
              <button
                class="button"
                type="button"
                data-gender-option="female"
                data-next-url="./quize3.html?gender=female"
                data-animate="pulse"
                aria-label="اختيار أنثى"
              >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img
                      class="remix-icons-line-2"
                      src="../assets/images/arrow-left-line.svg"
                    />
                  </div>
                  <div class="button-2">أنثي</div>
                </div>
              </button>
            </div>
            <div class="button-wrapper">
              <button
                class="button"
                type="button"
                data-gender-option="male"
                data-next-url="./quize3.html?gender=male"
                data-animate="pulse"
                aria-label="اختيار ذكر"
              >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img
                      class="remix-icons-line-2"
                      src="../assets/images/arrow-left-line.svg"
                    />
                  </div>
                  <div class="button-2">ذكر</div>
                </div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
