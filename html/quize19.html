<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 18</title>
    <style>
      .sweets-question {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .sweets-layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
      }

      @media (min-width: 900px) {
        .sweets-layout {
          flex-direction: row;
          align-items: stretch;
        }
      }

      .sweets-card {
        flex: 1 1 50%;
        display: flex;
        flex-direction: column;
        gap: 24px;
        background: #fff;
        border-radius: 24px;
        padding: clamp(20px, 3vw, 32px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      }

      .sweets-header {
        text-align: right;
      }

      .sweets-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .sweets-options {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: 100%;
      }

      .sweets-option {
        width: 100%;
        min-height: 92px;
        border: 2px solid #294e3e;
        border-radius: 12px;
        background: transparent;
        color: #294e3e;
        display: flex;
        align-items: center;
        padding: 0 28px;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        gap: 16px;
      }

      .sweets-option:focus-visible {
        outline: 3px solid #7cc5a7;
      }

      .sweets-option .option-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .sweets-option .option-label {
        direction: rtl;
      }

      .sweets-option .option-icon {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        padding: 8px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease;
      }

      .sweets-option .option-icon img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .sweets-option .option-spacer {
        flex: 1;
      }

      .sweets-option .option-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #294e3e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .sweets-option .option-tick {
        width: 12px;
        height: 7px;
        border-left: 2px solid #294e3e;
        border-bottom: 2px solid #294e3e;
        transform: rotate(-45deg);
        opacity: 0;
        transition: opacity 0.25s ease, border-color 0.25s ease;
      }

      .sweets-option.is-active {
        background: #bcdcce;
        border-color: #294e3e;
      }

      .sweets-option.is-active .option-icon {
        background: #deede7;
        box-shadow: inset 0 0 0 1px #294e3e0f;
      }

      .sweets-option.is-active .option-checkbox {
        background: #294e3e;
      }

      .sweets-option.is-active .option-tick {
        opacity: 1;
        border-color: #fff;
      }

      .sweets-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .sweets-actions .button {
        width: min(320px, 100%);
      }

      .sweets-actions .btn-primary-btn-lg {
        width: 100%;
      }

      .sweets-figure {
        flex: 1 1 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .sweets-figure img {
        width: 100%;
        height: auto;
        display: block;
      }

      @media (max-width: 899px) {
        .sweets-card {
          flex: 1 1 auto;
        }

        .sweets-figure {
          align-self: center;
          width: min(360px, 100%);
        }
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize18.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">18/47</div>
            <div class="text-wrapper-2">العادات الغذائية</div>
            <div class="text-wrapper">38%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="38"
              style="--progress-percent: 38%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 sweets-question">
          <div class="sweets-layout">
            <div class="sweets-card" data-sweets-widget>
              <div class="sweets-header">
                <p class="text-wrapper-3" data-sweets-title>هل تتناولين السكريات والحلويات بشكل يومي؟</p>
                <p class="sweets-description" data-sweets-description>
                  إخبارنا عن عاداتك مع السكريات يساعدنا على ضبط خطة غذائية متوازنة.
                </p>
              </div>
              <div class="sweets-options">
                <button class="sweets-option" type="button" data-sweets-option="yes" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon" aria-hidden="true">
                      <img src="../assets/images/right.svg" alt="" />
                    </div>
                    <span class="option-label">نعم</span>
                  </div>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
                <button class="sweets-option" type="button" data-sweets-option="no" aria-pressed="false">
                  <div class="option-right">
                    <div class="option-icon" aria-hidden="true">
                      <img src="../assets/images/false.svg" alt="" />
                    </div>
                    <span class="option-label">لا</span>
                  </div>
                  <div class="option-spacer" aria-hidden="true"></div>
                  <div class="option-checkbox" aria-hidden="true">
                    <div class="option-tick"></div>
                  </div>
                </button>
              </div>
              <div class="sweets-actions">
                <a
                  class="button"
                  data-animate="pulse"
                  href="./quize20.html"
                  aria-label="الانتقال إلى السؤال التالي"
                  data-sweets-next
                >
                  <div class="btn-primary-btn-lg">
                    <div class="masked-icon">
                      <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                    </div>
                    <div class="button-2">التالي</div>
                  </div>
                </a>
              </div>
            </div>
            <div class="sweets-figure" aria-hidden="true">
              <img src="../assets/images/sugarefood.svg" alt="" />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-sweets-widget]");
        if (!widget) return;

        const options = widget.querySelectorAll("[data-sweets-option]");
        const titleEl = widget.querySelector("[data-sweets-title]");
        const descriptionEl = widget.querySelector("[data-sweets-description]");
        const nextButton = widget.querySelector("[data-sweets-next]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "هل تتناول السكريات والحلويات بشكل يومي؟",
            description: "إخبارنا عن عاداتك مع السكريات يساعدنا على ضبط خطة غذائية متوازنة.",
          },
          female: {
            title: "هل تتناولين السكريات والحلويات بشكل يومي؟",
            description: "إخبارنا عن عاداتكِ مع السكريات يساعدنا على ضبط خطة غذائية متوازنة.",
          },
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (!currentCopy) return;
          if (titleEl) titleEl.textContent = currentCopy.title;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
        };

        let selectedOption = null;

        const setActiveOption = (button) => {
          if (!button) return;
          if (selectedOption === button) {
            button.classList.remove("is-active");
            button.setAttribute("aria-pressed", "false");
            selectedOption = null;
            widget.dataset.selectedSweets = "";
            return;
          }

          options.forEach((option) => {
            option.classList.toggle("is-active", option === button);
            option.setAttribute("aria-pressed", option === button ? "true" : "false");
          });
          selectedOption = button;
          widget.dataset.selectedSweets = button.dataset.sweetsOption || "";
        };

        options.forEach((button) => {
          button.addEventListener("click", () => setActiveOption(button));
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selectedOption) {
            event.preventDefault();
            setActiveOption(options[0] || null);
          }
        });

        applyCopy();
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
