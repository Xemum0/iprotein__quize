<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 24</title>
    <style>
      .conditions-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
      }

      .conditions-header {
        text-align: center;
        max-width: 640px;
        margin: 0 auto;
      }

      .conditions-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .conditions-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        width: 100%;
      }

      @media (max-width: 640px) {
        .conditions-grid {
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
      }

      .condition-option {
        border: 2px solid #d5e2db;
        border-radius: 18px;
        background: #fff;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        cursor: pointer;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        position: relative;
      }

      .condition-option button {
        all: unset;
      }

      .condition-option:focus-visible {
        outline: 3px solid #7cc5a7;
        outline-offset: 2px;
      }

      .condition-option .option-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .condition-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #eef6f3;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .condition-icon--placeholder {
        border: 2px dashed #d7e3dc;
        background: transparent;
      }

      .condition-icon img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      .condition-label {
        font-size: 1.1rem;
        font-weight: 700;
        color: #1f2933;
      }

      .condition-option .option-checkbox {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: 2px solid #294e3e;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 50%;
        left: 18px;
        transform: translateY(-50%);
        background: #fff;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .condition-option .option-checkbox::after {
        content: "";
        width: 12px;
        height: 7px;
        border-left: 2px solid transparent;
        border-bottom: 2px solid transparent;
        transform: rotate(-45deg);
        transition: border-color 0.25s ease;
      }

      .condition-option.is-active {
        border-color: #294e3e;
        background: #f3f8f6;
        box-shadow: 0 12px 30px rgba(39, 76, 62, 0.08);
      }

      .condition-option.is-active .option-checkbox {
        background: #294e3e;
        border-color: #294e3e;
      }

      .condition-option.is-active .option-checkbox::after {
        border-color: #fff;
      }

 

      .conditions-grid .conditions-other-field {
        margin: 12px 0;
        align-self: center;
      }

      .conditions-other-field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .conditions-other-field .input-outlined {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .conditions-other-field .form-control {
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        border: 1px solid var(--primitives-colors-natural-natural-200, #d5e2db);
        background-color: #fff;
      }

      .conditions-other-field .text-field {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 16px;
        position: relative;
      }

      .conditions-other-field .form-label {
        position: absolute;
        top: -11px;
        inset-inline-start: 16px;
        padding: 0 8px;
        background-color: #fff;
        border-radius: 4px;
        display: inline-flex;
        justify-content: flex-end;
      }

      .conditions-other-field .label-text {
        font-size: 12px;
        color: var(--primitives-colors-primary-primary-950, #0a3524);
        text-align: right;
        direction: rtl;
        font-weight: 600;
      }

      .conditions-other-field .content {
        flex: 1;
      }

      .conditions-other-field .input-text {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .conditions-other-field .input-text-2 {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-size: 16px;
        font-family: "IBM Plex Sans Arabic", Helvetica, sans-serif;
        color: var(--primitives-colors-primary-primary-950, #0a3524);
        text-align: right;
        direction: rtl;
      }

      .conditions-other-field.is-active .form-control {
        border-color: #294e3e;
        box-shadow: 0 8px 20px rgba(39, 76, 62, 0.12);
      }

      .conditions-next-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        align-self: center;
        margin: 12px 0;
      }

      .conditions-next-cell .button {
        width: min(320px, 100%);
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize10.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">24/47</div>
            <div class="text-wrapper-2">العادات الغذائية</div>
            <div class="text-wrapper">51%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="51"
              style="--progress-percent: 51%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 conditions-question" data-conditions-widget>
          <div class="conditions-header">
            <p class="text-wrapper-3" data-conditions-title>هل لديكِ حساسية من أطعمة معينة؟</p>
            <p class="conditions-description" data-conditions-description>
              إخبارنا بالحساسيات يساعدنا على تجنب المكونات غير المناسبة في خطتكِ الغذائية.
            </p>
          </div>
          <div class="conditions-grid">
            <button class="condition-option" type="button" data-condition-option="none" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="condition-icon">
                  <img src="../assets/images/false.svg" alt="" />
                </div>
                <span class="condition-label">لا أعاني من أي حساسية</span>
              </div>
            </button>
            <button class="condition-option" type="button" data-condition-option="peanuts" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="condition-icon">
                  <img src="../assets/images/question24/penuts.svg" alt="" />
                </div>
                <span class="condition-label">الفول السوداني</span>
              </div>
            </button>
            <button class="condition-option" type="button" data-condition-option="dairy" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="condition-icon">
                  <img src="../assets/images/question24/alban.svg" alt="" />
                </div>
                <span class="condition-label">منتجات الألبان</span>
              </div>
            </button>
            <button class="condition-option" type="button" data-condition-option="gluten" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="condition-icon">
                  <img src="../assets/images/question24/glutin.svg" alt="" />
                </div>
                <span class="condition-label">الغلوتين</span>
              </div>
            </button>
            <button class="condition-option" type="button" data-condition-option="egg" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="condition-icon">
                  <img src="../assets/images/question24/egg.svg" alt="" />
                </div>
                <span class="condition-label">البيض</span>
              </div>
            </button>
            <button class="condition-option" type="button" data-condition-option="seafood" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="condition-icon">
                  <img src="../assets/images/question24/fish.svg" alt="" />
                </div>
                <span class="condition-label">الأكلات البحرية</span>
              </div>
            </button>
            <div
              class="conditions-other-field"
              data-condition-option="other"
              role="group"
              aria-pressed="false"
            >
              <div class="input-outlined">
                <div class="form-control">
                  <div class="text-field">
                    <div class="form-label">
                      <div class="label-text">أخرى (يرجى التوضيح)</div>
                    </div>
                    <div class="content">
                      <div class="input-text">
                        <input
                          class="input-text-2"
                          type="text"
                          placeholder="اذكري نوع الحساسية"
                          data-conditions-other
                          aria-label="اذكري الحساسية الأخرى"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="conditions-next-cell">
              <a
                class="button"
                data-animate="pulse"
                href="./quize26.html"
                aria-label="الانتقال إلى السؤال التالي"
                data-conditions-next
              >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                  <div class="button-2">التالي</div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-conditions-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-condition-option]"));
        const nextButton = widget.querySelector("[data-conditions-next]");
        const titleEl = widget.querySelector("[data-conditions-title]");
        const descriptionEl = widget.querySelector("[data-conditions-description]");
        const otherOption = widget.querySelector("[data-condition-option='other']");
        const otherInput = widget.querySelector("[data-conditions-other]");

        const params = new URLSearchParams(window.location.search);
        const gender = (params.get("gender") || "").toLowerCase() === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "هل لديك حساسية من أطعمة معينة؟",
            description: "أخبرنا بحساسياتك الغذائية لنضمن خطة تخلو من المكونات غير الملائمة.",
          },
          female: {
            title: "هل لديكِ حساسية من أطعمة معينة؟",
            description: "شاركيننا بحساسياتكِ الغذائية لنضمن خطة تخلو من المكونات غير الملائمة.",
          },
        };

        const applyCopy = () => {
          const currentCopy = copy[gender];
          if (!currentCopy) return;
          if (titleEl) titleEl.textContent = currentCopy.title;
          if (descriptionEl) descriptionEl.textContent = currentCopy.description;
        };

        const selected = new Set();

        const updateDataset = () => {
          widget.dataset.selectedConditions = Array.from(selected).join(",");
        };

        const toggleOption = (option) => {
          if (!option) return;
          const key = option.dataset.conditionOption;
          const isOther = key === "other";

          if (!isOther) {
            if (selected.has(key)) {
              selected.delete(key);
              option.classList.remove("is-active");
              option.setAttribute("aria-pressed", "false");
            } else {
              selected.add(key);
              option.classList.add("is-active");
              option.setAttribute("aria-pressed", "true");
            }
          } else {
            const isActive = option.classList.contains("is-active");
            if (isActive) {
              selected.delete(key);
              option.classList.remove("is-active");
              option.setAttribute("aria-pressed", "false");
              if (otherInput && !otherInput.matches(":focus")) {
                otherInput.value = "";
              }
            } else {
              selected.add(key);
              option.classList.add("is-active");
              option.setAttribute("aria-pressed", "true");
              otherInput?.focus();
            }
          }

          updateDataset();
        };

        options.forEach((option) => {
          const key = option.dataset.conditionOption;
          if (key === "other") {
            option.addEventListener("click", () => otherInput?.focus());
            option.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                otherInput?.focus();
              }
            });
          } else {
            option.addEventListener("click", () => toggleOption(option));
          }
        });

        otherInput?.addEventListener("input", () => {
          const value = otherInput.value.trim();
          if (value) {
            selected.add("other");
            otherOption?.classList.add("is-active");
            otherOption?.setAttribute("aria-pressed", "true");
          } else {
            selected.delete("other");
            otherOption?.classList.remove("is-active");
            otherOption?.setAttribute("aria-pressed", "false");
          }
          updateDataset();
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selected.size) {
            event.preventDefault();
            const first = options.find((option) => option.dataset.conditionOption !== "other");
            if (first) toggleOption(first);
          }
        });

        applyCopy();
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
