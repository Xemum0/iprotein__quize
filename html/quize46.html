<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 45</title>
    <style>
      .challenges-question {
        display: flex;
        flex-direction: column;
        gap: 32px;
        width: 100%;
      }

      .challenges-header {
        text-align: center;
        max-width: 640px;
        margin: 0 auto;
      }

      .challenges-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 8px;
      }

      .challenges-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        width: 100%;
      }

      @media (max-width: 640px) {
        .challenges-grid {
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
      }

      .challenge-option {
        border: 2px solid #d5e2db;
        border-radius: 18px;
        background: #fff;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        cursor: pointer;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        position: relative;
      }

      .challenge-option:focus-visible {
        outline: 3px solid #7cc5a7;
        outline-offset: 2px;
      }

      .challenge-option .option-top {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .challenge-icon {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: #eef6f3;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .challenge-icon img {
        width: 32px;
        height: 32px;
        object-fit: contain;
      }

      .challenge-label {
        font-size: 1.1rem;
        font-weight: 700;
        color: #1f2933;
      }

      .challenge-option .option-checkbox {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: 2px solid #294e3e;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 50%;
        left: 18px;
        transform: translateY(-50%);
        background: #fff;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .challenge-option .option-checkbox::after {
        content: "";
        width: 12px;
        height: 7px;
        border-left: 2px solid transparent;
        border-bottom: 2px solid transparent;
        transform: rotate(-45deg);
        transition: border-color 0.25s ease;
      }

      .challenge-option.is-active {
        border-color: #294e3e;
        background: #f3f8f6;
        box-shadow: 0 12px 30px rgba(39, 76, 62, 0.08);
      }

      .challenge-option.is-active .option-checkbox {
        background: #294e3e;
        border-color: #294e3e;
      }

      .challenge-option.is-active .option-checkbox::after {
        border-color: #fff;
      }

      .challenges-other-field {
        grid-column: span 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      @media (max-width: 640px) {
        .challenges-other-field {
          grid-column: span 1;
        }
      }

      .challenges-other-field .input-outlined {
        width: 100%;
      }

      .challenges-other-field .form-control {
        display: flex;
        flex-direction: column;
        border-radius: 12px;
        border: 1px solid #d5e2db;
        background-color: #fff;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }

      .challenges-other-field .text-field {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 16px;
        position: relative;
      }

      .challenges-other-field .form-label {
        position: absolute;
        top: -11px;
        inset-inline-start: 16px;
        padding: 0 8px;
        background-color: #fff;
        border-radius: 4px;
        display: inline-flex;
      }

      .challenges-other-field .label-text {
        font-size: 12px;
        color: #0a3524;
        font-weight: 600;
      }

      .challenges-other-field .input-text {
        width: 100%;
      }

      .challenges-other-field .input-text-2 {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-size: 16px;
        font-family: "IBM Plex Sans Arabic", Helvetica, sans-serif;
        color: #0a3524;
        text-align: right;
        direction: rtl;
      }

      .challenges-other-field.is-active .form-control {
        border-color: #294e3e;
        box-shadow: 0 8px 20px rgba(39, 76, 62, 0.12);
      }

      .challenges-next-cell {
        grid-column: span 1;
        display: flex;
        justify-content: center;
        margin: 12px 0;
      }

      .challenges-next-cell .button {
        width: min(320px, 100%);
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize45.html" aria-label="عودة إلى السؤال السابق" data-challenges-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">45/47</div>
            <div class="text-wrapper-2">الاهداف الطموحات</div>
            <div class="text-wrapper">95%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="95"
              style="--progress-percent: 95%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 challenges-question" data-challenges-widget>
          <div class="challenges-header">
            <p class="text-wrapper-3" data-challenges-title>أصعب شيء في الالتزام بالبرنامج بالنسبة لك؟</p>
            <p class="challenges-description" data-challenges-description>
              أخبرنا بالعوائق الأكثر صعوبة حتى نوفر لك حلولاً عملية تساعدك على الاستمرار.
            </p>
          </div>
          <div class="challenges-grid">
            <button class="challenge-option" type="button" data-challenge-option="time" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="challenge-icon">
                  <img src="../assets/images/question45/timer.svg" alt="الالتزام بالوقت" />
                </div>
                <span class="challenge-label">الالتزام بالوقت</span>
              </div>
            </button>
            <button class="challenge-option" type="button" data-challenge-option="meals" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="challenge-icon">
                  <img src="../assets/images/question45/meals.svg" alt="الالتزام بالوجبات" />
                </div>
                <span class="challenge-label">الالتزام بالوجبات</span>
              </div>
            </button>
            <button class="challenge-option" type="button" data-challenge-option="workouts" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="challenge-icon">
                  <img src="../assets/images/question45/exercice.svg" alt="الالتزام بالتمارين" />
                </div>
                <span class="challenge-label">الالتزام بالتمارين</span>
              </div>
            </button>
            <button class="challenge-option" type="button" data-challenge-option="sleep" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="challenge-icon">
                  <img src="../assets/images/question45/sleep.svg" alt="قلة النوم والراحة" />
                </div>
                <span class="challenge-label">قلة النوم والراحة</span>
              </div>
            </button>
            <button class="challenge-option" type="button" data-challenge-option="motivation" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="challenge-icon">
                  <img src="../assets/images/question45/sad.svg" alt="فقدان الدافع" />
                </div>
                <span class="challenge-label">فقدان الدافع</span>
              </div>
            </button>
            <button class="challenge-option" type="button" data-challenge-option="work" aria-pressed="false">
              <div class="option-checkbox" aria-hidden="true"></div>
              <div class="option-top">
                <div class="challenge-icon">
                  <img src="../assets/images/question45/job.svg" alt="ضغوط العمل" />
                </div>
                <span class="challenge-label">ضغوط العمل</span>
              </div>
            </button>
            <div class="challenges-other-field" data-challenge-option="other" role="group" aria-pressed="false">
              <div class="input-outlined">
                <div class="form-control">
                  <div class="text-field">
                    <div class="form-label">
                      <div class="label-text">أخرى</div>
                    </div>
                    <div class="input-text">
                      <input
                        class="input-text-2"
                        type="text"
                        placeholder="اذكر التحدي"
                        data-challenges-other
                        aria-label="اذكر التحدي الآخر"
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="challenges-next-cell">
              <a
                class="button"
                data-animate="pulse"
                href="./quize47.html"
                aria-label="الانتقال إلى السؤال التالي"
                data-challenges-next
                data-challenges-gender-link
              >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                  <div class="button-2">التالي</div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const widget = document.querySelector("[data-challenges-widget]");
        if (!widget) return;

        const options = Array.from(widget.querySelectorAll("[data-challenge-option]"));
        const nextButton = widget.querySelector("[data-challenges-next]");
        const titleEl = widget.querySelector("[data-challenges-title]");
        const descriptionEl = widget.querySelector("[data-challenges-description]");
        const otherOption = widget.querySelector("[data-challenge-option='other']");
        const otherInput = widget.querySelector("[data-challenges-other]");
        const genderLinks = document.querySelectorAll("[data-challenges-gender-link]");

        const params = new URLSearchParams(window.location.search);
        const genderParam = (params.get("gender") || "").toLowerCase();
        const gender = genderParam === "female" ? "female" : "male";

        const copy = {
          male: {
            title: "أصعب شيء في الالتزام بالبرنامج بالنسبة لك؟",
            description: "أخبرنا بالعوائق الأكثر صعوبة حتى نوفر حلولاً عملية تساعدك على الاستمرار.",
            otherPlaceholder: "اذكر التحدي",
            otherAria: "اذكر التحدي الآخر"
          },
          female: {
            title: "أصعب شيء في الالتزام بالبرنامج بالنسبة لكِ؟",
            description: "أخبرينا بالعوائق الأكثر صعوبة حتى نوفر حلولاً عملية تساعدك على الاستمرار.",
            otherPlaceholder: "اذكري التحدي",
            otherAria: "اذكري التحدي الآخر"
          }
        };

        const applyGenderToLink = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const url = new URL(href, window.location.href);
          if (gender === "female") {
            url.searchParams.set("gender", "female");
          } else {
            url.searchParams.delete("gender");
          }
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };

        const applyCopy = () => {
          const data = copy[gender];
          if (titleEl) titleEl.textContent = data.title;
          if (descriptionEl) descriptionEl.textContent = data.description;
          if (otherInput) {
            otherInput.placeholder = data.otherPlaceholder;
            otherInput.setAttribute("aria-label", data.otherAria);
          }
        };

        const selected = new Set();

        const updateDataset = () => {
          widget.dataset.selectedChallenges = Array.from(selected).join(",");
        };

        const toggleOption = (option) => {
          if (!option) return;
          const key = option.dataset.challengeOption;
          if (!key || key === "other") return;

          if (selected.has(key)) {
            selected.delete(key);
            option.classList.remove("is-active");
            option.setAttribute("aria-pressed", "false");
          } else {
            selected.add(key);
            option.classList.add("is-active");
            option.setAttribute("aria-pressed", "true");
          }
          updateDataset();
        };

        options.forEach((option) => {
          const key = option.dataset.challengeOption;
          if (key === "other") {
            option.addEventListener("click", () => otherInput?.focus());
          } else {
            option.addEventListener("click", () => toggleOption(option));
          }
        });

        otherInput?.addEventListener("input", () => {
          const value = otherInput.value.trim();
          if (value) {
            selected.add("other");
            otherOption?.classList.add("is-active");
            otherOption?.setAttribute("aria-pressed", "true");
          } else {
            selected.delete("other");
            otherOption?.classList.remove("is-active");
            otherOption?.setAttribute("aria-pressed", "false");
          }
          updateDataset();
        });

        nextButton?.addEventListener("click", (event) => {
          if (!selected.size) {
            event.preventDefault();
            const first = options.find((option) => option.dataset.challengeOption !== "other");
            if (first) toggleOption(first);
          }
        });

        applyCopy();
        genderLinks.forEach(applyGenderToLink);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
