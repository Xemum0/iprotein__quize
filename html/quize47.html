<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 46</title>
    <style>
      .contact-question {
        display: flex;
        flex-direction: column;
        gap: 24px;
        width: 100%;
        align-items: center;
      }

      .contact-card {
        width: min(540px, 100%);
        border-radius: 24px;
        padding: clamp(24px, 4vw, 36px);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .contact-description {
        color: #6b7280;
        font-size: 1rem;
        margin-top: 6px;
      }

      .contact-field .input-outlined {
        width: 100%;
      }

      .contact-field .form-control {
        border: 1px solid #d5e2db;
        border-radius: 18px;
        transition: border-color 0.25s ease, box-shadow 0.25s ease;
      }

      .contact-field:focus-within .form-control {
        border-color: #294e3e;
        box-shadow: 0 8px 24px rgba(39, 76, 62, 0.12);
      }

      .contact-field .text-field {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 18px;
        position: relative;
      }

      .contact-field .form-label {
        position: absolute;
        top: -12px;
        inset-inline-start: 18px;
        padding: 0 10px;
        background: #fff;
        border-radius: 12px;
      }

      .contact-field .label-text {
        font-size: 0.9rem;
        font-weight: 600;
        color: #0a3524;
      }

      .contact-field .input-text {
        flex: 1;
      }

      .contact-field .input-text-2 {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        font-size: 1rem;
        font-family: "IBM Plex Sans Arabic", sans-serif;
        color: #0a3524;
        text-align: right;
        direction: rtl;
      }

      .contact-field-icon {
        width: 28px;
        height: 28px;
        object-fit: contain;
      }

      .contact-hint {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #6b7280;
        font-size: 0.95rem;
        flex-direction: row-reverse;
      }

      .contact-hint img {
        width: 20px;
        height: 20px;
        object-fit: contain;
      }

      .contact-actions {
        display: flex;
        justify-content: center;
        margin-top: 8px;
      }

      .contact-actions .button {
        width: min(320px, 100%);
      }

      .input-error {
        display: none;
        background: var(--primitives-colors-error-error-100, #fcdede);
        color: var(--primitives-colors-error-error-600, #c10b11);
        border: 1px solid var(--primitives-colors-error-error-600, #c10b11);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 0.95rem;
        direction: rtl;
        text-align: right;
      }

      .input-error.is-visible {
        display: block;
      }

      .form-control.is-error {
        border-color: var(--primitives-colors-error-error-600, #c10b11);
        box-shadow: 0 0 0 1px rgba(193, 11, 17, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-name-screen">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize46.html" aria-label="عودة إلى السؤال السابق" data-contact-gender-link>
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">46/47</div>
            <div class="text-wrapper-2">معلومات التواصل</div>
            <div class="text-wrapper">98%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="98"
              style="--progress-percent: 98%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 contact-question">
          <div class="contact-card" data-contact-widget>
            <div>
              <p class="text-wrapper-3">يرجي ادخال البريد الالكتروني</p>
              <p class="contact-description">سنستخدم بريدك لإرسال خطة التغذية والمتابعة معك.</p>
            </div>
            <div class="contact-field">
              <div class="input-outlined">
                <div class="form-control">
                  <div class="text-field">
                    <div class="form-label">
                      <div class="label-text">البريد الإلكتروني</div>
                    </div>
                    <img class="contact-field-icon" src="../assets/images/mail.svg" alt="" />
                    <div class="content">
                      <div class="input-text">
                        <input
                          class="input-text-2"
                          type="email"
                          placeholder="أدخل بريدك الإلكتروني"
                          aria-label="يرجي ادخال البريد الالكتروني"
                          data-contact-input
                        />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="input-error" data-contact-error aria-live="polite" hidden></div>
            <div class="contact-actions">
              <a
                class="button"
                data-animate="pulse"
                href="./quize48.html"
                aria-label="الانتقال إلى السؤال التالي"
                data-contact-gender-link
              >
                <div class="btn-primary-btn-lg">
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                  <div class="button-2">التالي</div>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const isFemale = (params.get("gender") || "").toLowerCase() === "female";
        const applyGender = (link) => {
          if (!link) return;
          const href = link.getAttribute("href");
          if (!href) return;
          const url = new URL(href, window.location.href);
          if (isFemale) {
            url.searchParams.set("gender", "female");
          } else {
            url.searchParams.delete("gender");
          }
          link.setAttribute("href", `${url.pathname}${url.search}${url.hash}`);
        };
        document.querySelectorAll("[data-contact-gender-link]").forEach(applyGender);

        const widget = document.querySelector("[data-contact-widget]");
        if (!widget) return;
        const input = widget.querySelector("[data-contact-input]");
        const errorEl = widget.querySelector("[data-contact-error]");
        const control = widget.querySelector(".form-control");
        const nextLink = widget.querySelector("[data-contact-gender-link]");

        const emailValid = (value) => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value);

        const showError = (msg) => {
          if (errorEl) {
            errorEl.textContent = msg;
            errorEl.hidden = false;
            errorEl.classList.add("is-visible");
          }
          control?.classList.add("is-error");
        };

        const clearError = () => {
          if (errorEl) {
            errorEl.hidden = true;
            errorEl.classList.remove("is-visible");
            errorEl.textContent = "";
          }
          control?.classList.remove("is-error");
        };

        nextLink?.addEventListener("click", (e) => {
          const value = (input?.value || "").trim();
          if (!emailValid(value)) {
            e.preventDefault();
            showError("يرجى إدخال بريد إلكتروني صالح للمتابعة.");
            input?.focus();
          } else {
            clearError();
          }
        });

        input?.addEventListener("input", clearError);
      })();
    </script>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
