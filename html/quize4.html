<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/quiz.css" />
    <title>iProtein Quiz - Question 3</title>
  </head>
  <body>
    <div class="AI-coach-quiz-2 quiz-placeholder-screen" data-question-number="3">
      <header class="header">
        <div class="frame">
          <div class="remix-icons-line-wrapper">
            <a class="icon-button" href="./quize3.html" aria-label="عودة إلى السؤال السابق">
              <img class="remix-icons-line" src="../assets/images/arrow-right-s-line.svg" alt="" />
            </a>
          </div>
          <div class="logo-wrapper">
            <div class="logo">
              <img class="group" src="../assets/images/logo.svg" alt="iProtein" />
            </div>
          </div>
          <div class="remix-icons-line-wrapper">
            <img class="remix-icons-line" src="../assets/images/close.svg" alt="إغلاق" />
          </div>
        </div>
      </header>
      <div class="frame-2">
        <div class="frame-3">
          <div class="frame-4">
            <div class="text-wrapper">3/47</div>
            <div class="text-wrapper-2">المعلومات الشخصية</div>
            <div class="text-wrapper">6%</div>
          </div>
          <div class="progress-section">
            <div
              class="progress-bar"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="6"
              style="--progress-percent: 6%; --total-steps: 7"
            >
              <div class="progress-line">
                <span class="progress-line-fill" aria-hidden="true"></span>
              </div>
              <ol class="progress-step-list" aria-label="مراحل الاختبار">
                  <li class="progress-step completed">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
                  <li class="progress-step">
                    <span class="progress-node" aria-hidden="true"></span>
                  </li>
              </ol>
            </div>
          </div>
        </div>
        <div class="frame-6 age-question">
          <div class="text-wrapper-3 age-question-title">اختر فئة عمرك:</div>
          <div class="age-option-list" data-age-options>
            <article class="age-option-card" data-age-card>
              <img
                class="age-option-figure"
                src="../assets/images/question3/male1.svg"
                alt="فئة العمر 29-18"
                data-age-figure
                data-male-src="../assets/images/question3/male1.svg"
                data-female-src="../assets/images/question3/female1.svg"
              />
              <button
                class="button age-option-button"
                type="button"
                data-age-value="29-18"
                data-next-url="./quize5.html"
                aria-pressed="false"
                data-animate="pulse"
              >
                <div class="btn-primary-btn-lg">
                  <div class="button-2">العمر: 29-18</div>
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                </div>
              </button>
            </article>
            <article class="age-option-card" data-age-card>
              <img
                class="age-option-figure"
                src="../assets/images/question3/male2.svg"
                alt="فئة العمر 39-30"
                data-age-figure
                data-male-src="../assets/images/question3/male2.svg"
                data-female-src="../assets/images/question3/female2.svg"
              />
              <button
                class="button age-option-button"
                type="button"
                data-age-value="39-30"
                data-next-url="./quize5.html"
                aria-pressed="false"
                data-animate="pulse"
              >
                <div class="btn-primary-btn-lg">
                  <div class="button-2">العمر: 39-30</div>
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                </div>
              </button>
            </article>
            <article class="age-option-card" data-age-card>
              <img
                class="age-option-figure"
                src="../assets/images/question3/male3.svg"
                alt="فئة العمر 49-40"
                data-age-figure
                data-male-src="../assets/images/question3/male3.svg"
                data-female-src="../assets/images/question3/female3.svg"
              />
              <button
                class="button age-option-button"
                type="button"
                data-age-value="49-40"
                data-next-url="./quize5.html"
                aria-pressed="false"
                data-animate="pulse"
              >
                <div class="btn-primary-btn-lg">
                  <div class="button-2">العمر: 49-40</div>
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                </div>
              </button>
            </article>
            <article class="age-option-card" data-age-card>
              <img
                class="age-option-figure"
                src="../assets/images/question3/male4.svg"
                alt="فئة العمر +50"
                data-age-figure
                data-male-src="../assets/images/question3/male4.svg"
                data-female-src="../assets/images/question3/female4.svg"
              />
              <button
                class="button age-option-button"
                type="button"
                data-age-value="+50"
                data-next-url="./quize5.html"
                aria-pressed="false"
                data-animate="pulse"
              >
                <div class="btn-primary-btn-lg">
                  <div class="button-2">العمر: +50</div>
                  <div class="masked-icon">
                    <img class="remix-icons-line-2" src="../assets/images/arrow-left-line.svg" alt="" />
                  </div>
                </div>
              </button>
            </article>
          </div>
        </div>
      </div>
    </div>
    <script src="../assets/js/quiz.js"></script>
  </body>
</html>
